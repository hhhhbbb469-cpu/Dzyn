<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DZY Chess">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>DZY CHESS — dzyn999</title>
<style>:root{--bg:#0c0a14;--panel:#1a1628;--line:#ffffff1c;--ink:#f3eefc;--dim:#a9a0c2;--gold:#e8b84a;--violet:#7b5cff;--bad:#ff5470;--good:#43d9a0;--spd:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% -10%,#2b1f52 0%,var(--bg) 62%);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:var(--ink);background:#0f0c1b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;-webkit-user-select:text;user-select:text;font-size:16px}
textarea{resize:vertical;font:13px/1.4 ui-monospace,Menlo,monospace}
button,.btn{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:650;background:linear-gradient(135deg,#8a6bff,#5736d6);box-shadow:0 6px 18px #4a2ccc55,inset 0 1px #ffffff40;transition:transform .12s,filter .2s,box-shadow .2s}
.btn:hover:not(:disabled){filter:brightness(1.18);box-shadow:0 8px 24px #7b5cff88,inset 0 1px #ffffff55}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.ghost{background:#ffffff0f;box-shadow:inset 0 0 0 1px var(--line)}
.btn.gold{background:linear-gradient(135deg,#ffe08a,#c68d22);color:#2a1a00;box-shadow:0 6px 18px #c68d2255}
.btn.wide{width:100%;margin-top:8px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.row3 .btn{padding:10px 4px;font-size:13px}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);animation:screen-in calc(.38s*var(--spd)) cubic-bezier(.2,.8,.2,1)}
@keyframes screen-in{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(5px)}}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:46px}
.top h2{flex:1;text-align:center;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.icon{width:38px;height:38px;border-radius:12px;font-size:26px;line-height:1;background:#ffffff10}.icon.ph{visibility:hidden}
.mn{min-width:38px;text-align:right;font-size:12px;color:var(--dim);white-space:nowrap}
.scroll{flex:1;overflow:auto;padding:8px 14px 24px;width:100%;max-width:620px;margin:0 auto;-webkit-overflow-scrolling:touch}
.panel{background:linear-gradient(160deg,#221c36,#16121f);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 12px 30px #0007}
label{display:block;margin:10px 0 6px;color:var(--dim);font-size:13px}
.note{font-size:12.5px;color:var(--dim);margin:8px 0}.center{text-align:center}

/* khởi động */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 40%,#2c1d57,#07050e 75%);transition:opacity calc(.7s*var(--spd)),clip-path calc(.75s*var(--spd)) cubic-bezier(.7,0,.3,1);clip-path:circle(150% at 50% 40%)}
#splash.out{clip-path:circle(0% at 50% 40%);opacity:.4;pointer-events:none}
.sp-in{text-align:center;width:min(78vw,320px)}
.logo{width:100%;max-width:300px;filter:drop-shadow(0 8px 22px #e8b84a55)}
.ld{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s .35s ease-out forwards}.l2{animation-delay:.6s}.l3{animation-delay:.85s}
@keyframes draw{to{stroke-dashoffset:0}}
.crown{animation:crown .8s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes crown{from{opacity:0;transform:translateY(-40px)}}
.chk rect{animation:chk .5s backwards}.chk rect:nth-child(n+5){animation-delay:1.1s}.chk rect:nth-child(n+9){animation-delay:1.25s}.chk rect:nth-child(n+13){animation-delay:1.4s}
@keyframes chk{from{opacity:0}}
.sp-in h1{letter-spacing:.34em;font-size:25px;margin-top:14px;background:linear-gradient(100deg,#fff 30%,#e8b84a 50%,#fff 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s .9s backwards,sheen 2.4s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;translate:0 14px}}
.by{color:var(--dim);letter-spacing:.3em;animation:rise .6s 1.15s backwards}
.bar{height:10px;border-radius:9px;margin:26px 0 10px;background:#ffffff14;overflow:hidden;box-shadow:inset 0 0 0 1px #e8b84a55}
.bar i{display:block;height:100%;width:4%;background:repeating-linear-gradient(115deg,#ffe08a 0 10px,#c68d22 10px 20px) 0 0/200% 100%;transition:width .45s;animation:stripes 1.2s linear infinite;box-shadow:0 0 14px #ffd76a}
@keyframes stripes{to{background-position:-89px 0}}
#sp-msg{font-size:13px;color:var(--dim)}#sp-msg.err{color:var(--bad)}

/* trang chủ */
.home{margin:auto;width:100%;max-width:880px;max-height:100%;overflow:auto;padding:12px 16px;display:grid;gap:14px}
.brand{text-align:center}.brand .logo{max-width:170px}.brand h1{font-size:24px;letter-spacing:.32em}.brand p{color:var(--dim);font-size:13px}.brand p b{color:var(--gold)}
nav{width:100%;max-width:440px;margin:0 auto}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;margin-top:10px;border-radius:18px;position:relative;overflow:hidden;border:1px solid #ffffff2a;box-shadow:0 10px 24px #0008,inset 0 1px #ffffff35;transition:transform .15s,filter .2s;animation:rise .45s backwards}
.mode:hover{filter:brightness(1.2);transform:translateY(-2px)}.mode:active{transform:scale(.97)}
.mode::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#fff3 50%,transparent 60%) 120% 0/250% 100%;transition:background-position .6s}
.mode:hover::after,.mode:active::after{background-position:-20% 0}
.m-off{background:linear-gradient(120deg,#7a4a12,#3a2206)}.m-on{background:linear-gradient(120deg,#0f6b66,#08302f);animation-delay:.06s}.m-ai{background:linear-gradient(120deg,#5b2fa8,#251246);animation-delay:.12s}
.mode .ic svg{width:44px;height:44px;fill:currentColor;display:block}.mode b{display:block;font-size:18px}.mode small{color:#ffffffb5}.mode>span:nth-child(2){flex:1}.mode i{font-style:normal;font-size:28px;opacity:.7}
@media (orientation:landscape) and (max-height:620px){.home{grid-template-columns:1fr 1.3fr;align-items:center}.mode{padding:9px 14px;margin-top:7px}.mode .ic svg{width:32px;height:32px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:16px;background:linear-gradient(150deg,#2a2144,#171221);border:1px solid var(--line);animation:rise .4s calc(var(--i)*45ms) backwards;transition:transform .15s,border-color .2s,box-shadow .2s}
.tile:hover{border-color:var(--gold);box-shadow:0 0 20px #e8b84a33;transform:translateY(-2px)}
.tile em{font-style:normal;font-size:26px;color:var(--gold);line-height:1.1}.tile small{color:var(--dim)}

/* hộp thoại, thông báo */
#modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:14px;background:#05030bb8}
#modal.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(420px,100%);max-height:92vh;max-height:92dvh;overflow:auto;background:linear-gradient(170deg,#251e3d,#130f1d);border:1px solid #ffffff2c;border-radius:20px;padding:18px;box-shadow:0 30px 80px #000c;animation:pop calc(.32s*var(--spd)) cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}}
.sheet h3{text-align:center;margin-bottom:6px}.q{text-align:center;font-size:16px;margin-bottom:8px}.sheet input:not([type]),.sheet input[data-nw],.sheet input[data-nb]{margin-top:8px}
.sheet video{width:100%;border-radius:12px;background:#000;max-height:60vh}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 auto;padding:9px 10px;border-radius:10px;background:#ffffff0e;border:1px solid var(--line);font-size:13px;transition:.18s}
.seg button.on{background:linear-gradient(135deg,#ffe08a,#c68d22);color:#251700;font-weight:700;border-color:transparent}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:18px;height:18px}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:90%;padding:9px 16px;border-radius:12px;background:#2c2545f2;border:1px solid var(--line);box-shadow:0 8px 24px #0008;animation:toast .35s cubic-bezier(.2,1.4,.4,1);transition:.35s}
.toast.ok{border-color:var(--good)}.toast.err{border-color:var(--bad)}.toast.out{opacity:0;transform:translateY(-12px)}
@keyframes toast{from{opacity:0;transform:translateY(-20px) scale(.9)}}
#confetti{position:fixed;inset:0;z-index:35;pointer-events:none;display:none}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.promo.upside{rotate:180deg}.promo button{background:#e9dfc5;border-radius:14px;padding:4px;animation:pop .35s backwards}.promo button:nth-child(2){animation-delay:.05s}.promo button:nth-child(3){animation-delay:.1s}.promo button:nth-child(4){animation-delay:.15s}.promo img{width:100%;display:block}
.result{text-align:center}.emblem{font-size:64px;line-height:1.2;color:var(--gold);animation:emblem .8s cubic-bezier(.2,1.6,.4,1)}
.result h3{font-size:26px}.result p{color:var(--dim);margin-bottom:6px}
.result.lose .emblem{color:var(--bad);animation:fall .8s}.result.draw .emblem{color:#c9d2e8;animation:sway 1s}
@keyframes emblem{from{transform:scale(0) rotate(-200deg)}}
@keyframes fall{from{transform:translateY(-60px);opacity:0}70%{transform:translateY(6px) rotate(8deg)}}
@keyframes sway{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

/* bàn cờ */
.boardwrap{--pad:0px;position:relative;aspect-ratio:1;flex:none;border-radius:8px;box-shadow:0 18px 44px #000a;touch-action:none}
.boardwrap[data-coords=out]{--pad:calc(var(--s,340px)*.038)}
.boardwrap.rotating{box-shadow:none}
.spin{position:absolute;inset:0;background:var(--frame);border-radius:8px;will-change:transform}
.rotating .spin{box-shadow:0 30px 60px #000c}
.grid{position:absolute;inset:var(--pad);touch-action:none;cursor:pointer}
.bg,.layer{position:absolute;inset:0}.bg{background-size:100% 100%}
.layer{pointer-events:none}
.sq,.pc,.burst{position:absolute;left:0;top:0;width:12.5%;height:12.5%}
.sq::before,.sq::after{content:"";position:absolute;inset:0}
.sq.last::before{background:#ffe14d66}
.sq.sel::before{background:#37e0a588;box-shadow:inset 0 0 0 3px #eafff6;animation:fade .15s}
.sq.legal::after{inset:34%;border-radius:50%;background:#0d3b2aaa;box-shadow:0 0 0 2px #ffffff90;animation:dot .22s cubic-bezier(.2,1.8,.4,1)}
@keyframes dot{from{scale:0}}
.sq.cap::after{inset:3%;border-radius:50%;border:4px solid #e8323cd0;animation:dot .22s}
.sq.hint::before{box-shadow:inset 0 0 0 4px #29b6ff;background:#29b6ff44;animation:pulse 1s infinite alternate}
.sq.check::before{background:radial-gradient(circle,#ff1f3d 0%,#ff1f3dcc 35%,transparent 72%);animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:.45}}
.sq.mate::before{background:radial-gradient(circle,#fff 0,#ff1f3d 38%,#6b0010 100%);animation:mate .5s 5 alternate}
@keyframes mate{from{filter:brightness(.7)}to{filter:brightness(1.6)}}
.pc{z-index:1}.pc.moving{z-index:3}.pc.dead{z-index:2}.pc.drag{z-index:5}
.pi{position:absolute;inset:1%;background:center/contain no-repeat;translate:0 0}
.pc.picked .pi{animation:lift .5s ease-in-out infinite alternate}
@keyframes lift{from{scale:1.07}to{scale:1.14;translate:0 -4%}}
.pc.drag .pi{animation:none;scale:1.5;translate:0 -22%;filter:drop-shadow(0 8px 6px #0007)}
.pc.mated .pi{transform-origin:50% 90%;animation:topple 1s .15s forwards cubic-bezier(.5,0,.8,.5)}
@keyframes topple{20%{transform:rotate(-8deg)}to{transform:rotate(78deg)}}
.mating .spin{animation:shake .6s}
@keyframes shake{15%,55%{translate:-7px 2px}35%,75%{translate:7px -2px}}
.face-b .pi,.face-b .coord{rotate:180deg}.pi{transition:rotate calc(.4s*var(--spd))}
.spark{position:absolute;left:46%;top:46%;width:8%;height:8%;border-radius:50%;background:#ffd76a;box-shadow:0 0 8px #ff9d3c;animation:spark .5s ease-out forwards}
@keyframes spark{from{transform:rotate(var(--a)) translateX(0)}to{transform:rotate(var(--a)) translateX(700%) scale(.2);opacity:0}}
.nofx .spark,.nofx .burst{display:none}
.coord{position:absolute;display:flex;align-items:center;justify-content:center;font:700 calc(var(--s,340px)*.027)/1 system-ui;color:var(--ink);color:var(--ink,#fff);pointer-events:none}
.boardwrap .coord{color:var(--ink)}
.coord.cb,.coord.ct{width:calc((100% - 2*var(--pad))/8);height:var(--pad);left:calc(var(--pad) + var(--i)*(100% - 2*var(--pad))/8)}
.coord.cl,.coord.cr{height:calc((100% - 2*var(--pad))/8);width:var(--pad);top:calc(var(--pad) + var(--i)*(100% - 2*var(--pad))/8)}
.coord.cb{bottom:0}.coord.ct{top:0}.coord.cl{left:0}.coord.cr{right:0}
[data-coords=in] .coord{z-index:2;height:12.5%;width:12.5%;padding:2px 3px}
[data-coords=in] .coord.cb{left:calc(var(--i)*12.5%);justify-content:flex-end;align-items:flex-end}
[data-coords=in] .coord.cl{top:calc(var(--i)*12.5%);justify-content:flex-start;align-items:flex-start}
[data-coords=in] .coord.on-lt{color:var(--dk);text-shadow:0 0 2px #fff}[data-coords=in] .coord.on-dk{color:var(--lt);text-shadow:0 0 2px #000}
[data-coords=in] .ct,[data-coords=in] .cr,[data-coords=none] .coord{display:none}

/* trận đấu */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:0 4px 4px}
.stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:visible}
.player{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;background:#ffffff0a;border:1px solid transparent;transition:border-color .25s,box-shadow .25s,rotate .4s}
.player.active{border-color:var(--gold);box-shadow:0 0 14px #e8b84a40}
.facing .pt{rotate:180deg}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}.av.w{background:radial-gradient(#6b5a9a,#2a2145)}.av.b{background:radial-gradient(#f3e7c6,#b79d68)}.av img{width:32px}
.who{flex:1;min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--dim);font-size:11.5px}
.caps{display:flex;flex-wrap:wrap;height:16px;overflow:hidden}.caps img{width:16px;height:16px;margin-right:-4px;filter:drop-shadow(0 0 1px #fff9)}
.clock{text-align:right;padding:3px 9px;border-radius:9px;background:#0b0813;font-variant-numeric:tabular-nums;min-width:82px}.clock b{display:block;font-size:19px}.clock small{font-size:10px;color:var(--dim)}
.active .clock{background:#f1ead8;color:#201a10}.active .clock small{color:#5b5140}
.clock.low{background:#a3132c!important;color:#fff!important;animation:pulse .5s infinite alternate}
.status{text-align:center;font-size:13px;color:var(--gold);min-height:18px}
.side{display:flex;flex-direction:column;gap:4px;min-height:0}
.movelist{display:flex;align-items:center;gap:2px;overflow:auto;white-space:nowrap;min-height:28px;background:#0b081380;border-radius:9px;padding:2px 6px;position:relative;scrollbar-width:none}
.movelist i{color:var(--dim);font-style:normal;font-size:12px;margin-left:5px}.movelist button{padding:3px 6px;border-radius:6px;font-size:13px}.movelist button.on{background:var(--violet)}
.evalbox{font-size:12.5px;padding:5px 8px;background:#ffffff0a;border-radius:9px;min-height:44px}.evalbox div{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{padding:4px;background:#ffffff0c;border-radius:8px}
.toolbar{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.tool{flex:1 1 0;min-width:44px;max-width:76px;display:flex;flex-direction:column;align-items:center;padding:4px 1px;border-radius:10px;background:#ffffff0c;position:relative;transition:background .2s,transform .1s}
.tool:hover:not(:disabled){background:#7b5cff55}.tool:active{transform:scale(.92)}
.tool span{font-size:18px;line-height:1.2}.tool small{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;max-width:100%}
.tool.off span{opacity:.35;text-decoration:line-through}.tool.busy span{animation:turn 1s linear infinite}
@keyframes turn{to{rotate:360deg}}
.tool.badge::after{content:"";position:absolute;top:3px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:dot .5s infinite alternate}
.banner{position:absolute;left:50%;top:46%;translate:-50% 0;z-index:8;padding:10px 18px;border-radius:12px;background:#2b0f1bf0;border:1px solid var(--bad);animation:toast .35s;text-align:center;max-width:92%;pointer-events:none}
.chat{display:flex;flex-direction:column;gap:4px;height:min(34vh,250px);min-height:130px;background:#0b0813c0;border:1px solid var(--line);border-radius:12px;padding:6px;animation:rise .25s}
.chatting .side{display:none}
.msgs{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:4px}
.msg{align-self:flex-start;max-width:85%;background:#2b2442;border-radius:12px 12px 12px 3px;padding:4px 10px;animation:msg .3s cubic-bezier(.2,1.5,.4,1)}
.msg.mine{align-self:flex-end;background:#4a34a8;border-radius:12px 12px 3px 12px}.msg small{font-size:10px;color:#ffffff90}.msg p{overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
@keyframes msg{from{opacity:0;transform:translateY(10px) scale(.85)}}
.emo{display:flex;justify-content:space-between;overflow:auto}.emo button{font-size:18px;padding:0 3px}
#chatform{display:flex;gap:6px}#chatform input{padding:6px 10px;min-width:0}#chatform .btn{padding:6px 12px}
@media (orientation:landscape){
 .gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,340px);grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:10px;padding:0 8px 6px}
 .stage{grid-column:1;grid-row:1/-1}
 .pt{grid-column:2;grid-row:1}.status{grid-column:2;grid-row:2}.side,.chat{grid-column:2;grid-row:3}.pb{grid-column:2;grid-row:4}.toolbar{grid-column:2;grid-row:5}
 .movelist{flex:1;min-height:0;flex-wrap:wrap;align-content:flex-start;white-space:normal}
 .movelist i{width:16%;text-align:right}.movelist button{width:32%;text-align:left}
 .chat{height:auto;min-height:0}
}
@media (orientation:landscape) and (min-width:1100px){
 .gwrap{grid-template-columns:300px minmax(0,1fr) 340px;grid-template-rows:auto auto minmax(0,1fr) auto auto}
 .pt{grid-column:1;grid-row:1;align-self:start}.pb{grid-column:1;grid-row:4}.status{grid-column:1;grid-row:2}.toolbar{grid-column:1;grid-row:5}
 .stage{grid-column:2}.side,.chat{grid-column:3;grid-row:1/-1}
}
@media (orientation:landscape) and (max-height:500px){
 .s-game .top{position:absolute;left:4px;top:2px;z-index:5;padding:0;min-height:0}.s-game .top h2,.s-game .mn{display:none}
 .gwrap{padding-top:4px;row-gap:2px;grid-template-columns:minmax(0,1fr) minmax(250px,46%)}
 .player{padding:2px 6px}.av{width:30px;height:30px}.av img{width:26px}.caps{display:none}.clock b{font-size:16px}
 .tool{min-width:36px;padding:2px 0}.tool small{display:none}.nav button{padding:1px}.status{font-size:11px;min-height:14px}
 .chat .emo{display:none}.chatting .status{display:none}.chatting .pt,.chatting .pb{padding:0 6px}.chatting .av,.chatting .clock small{display:none}
}
@media (orientation:portrait) and (max-height:700px){.caps{display:none}.av{width:30px;height:30px}.av img{width:26px}.nav{display:none}.chatting .status{display:none}}

/* cài đặt, chủ đề, lịch sử, online */

input.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.25s}

/* ===== đăng nhập / đăng ký ===== */
.s-auth{background:radial-gradient(100% 70% at 50% 0%,#33226a,#0a0714 70%)}

@keyframes aufloat{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:.16}85%{opacity:.12}100%{opacity:0;transform:translateY(-118vh) rotate(var(--r))}}
.au-card{position:relative;margin:auto;width:min(100%,380px);padding:22px 20px 18px;border-radius:24px;background:linear-gradient(160deg,#241c3de6,#14101fe6);border:1px solid #e8b84a40;box-shadow:0 24px 60px #000a,0 0 0 1px #ffffff0d inset,0 0 50px #7b5cff22;backdrop-filter:blur(10px);animation:aucard .7s cubic-bezier(.2,.9,.25,1.1) backwards}

@keyframes aushine{60%,100%{left:130%}}
.au-card .btn.busy{pointer-events:none;opacity:.7}

@keyframes aushake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

@keyframes auok{40%{transform:scale(1.04);box-shadow:0 0 80px #43d9a066}to{opacity:0;transform:translateY(-30px) scale(.94)}}

.coinchip:hover{box-shadow:0 0 18px #e8b84a55;transform:translateY(-1px)}.coinchip span{font-weight:750;font-size:13px;color:var(--gold)}

.pend{display:flex;align-items:center;gap:10px;border-color:#e8b84a77;animation:rise .4s}.pend span{font-size:24px}.pend div{flex:1;display:flex;flex-direction:column}.pend small{color:var(--dim)}

.pos{color:var(--good)}.neg{color:var(--bad)}
.qrbox{text-align:center}.qrbox h3{margin-bottom:10px;font-size:17px}
.qrw{position:relative;width:min(260px,70vw);margin:0 auto}.qrimg{position:relative;border-radius:16px;overflow:hidden;padding:6px;background:#fff;box-shadow:0 0 0 3px var(--gold),0 0 32px #e8b84a55;animation:rise .45s}

/* ===== trang cá nhân · avatar · khung viền ===== */
.pf{--sz:40px;--w:10%;position:relative;display:inline-block;flex:none;vertical-align:middle;width:var(--sz);height:var(--sz)}
.pf-r{position:absolute;inset:0;border-radius:50%;background:var(--cg);-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - var(--w)),#000 calc(100% - var(--w) + 1px));mask:radial-gradient(farthest-side,#0000 calc(100% - var(--w)),#000 calc(100% - var(--w) + 1px));animation:pfrot var(--sp) linear infinite}
.pf.still .pf-r{animation:none}
.pf-a{position:absolute;inset:calc(var(--w) + 1.5%);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--bg);box-shadow:inset 0 0 0 1px #0007,inset 0 -6px 12px #0005}
.pf .pf-a img{width:84%;height:84%;margin:0;filter:drop-shadow(0 2px 2px #0008)}
.pf-a.rb{background:linear-gradient(135deg,#ff8a8a,#ffd36b,#8affc1,#8ab8ff,#d48aff,#ff8a8a);background-size:300% 300%;animation:stripes2 4s linear infinite}
.pf.sh .pf-a::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#0000 38%,#fffa 50%,#0000 62%);transform:translateX(-120%);animation:pfshine 3.2s ease-in-out infinite}
.pf.glow::after{content:'';position:absolute;inset:-4%;border-radius:50%;pointer-events:none;box-shadow:0 0 calc(var(--sz)*.28) calc(var(--sz)*.03) var(--gc);animation:pfglow 2.2s ease-in-out infinite alternate}
.pf.ring2::before{content:'';position:absolute;inset:-9%;border-radius:50%;background:var(--cg);opacity:.9;-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 3.5%),#000 calc(100% - 3.5% + 1px));mask:radial-gradient(farthest-side,#0000 calc(100% - 3.5%),#000 calc(100% - 3.5% + 1px));animation:pfrot calc(var(--sp)*1.7) linear infinite reverse}
.pf.hue .pf-r,.pf.hue.ring2::before{animation:pfrot var(--sp) linear infinite,pfhue 5s linear infinite}
.pf.halo{filter:drop-shadow(0 0 calc(var(--sz)*.12) #ffd36b)}
.pf.wings{margin-inline:calc(var(--sz)*.32)}.pf.crown{margin-top:calc(var(--sz)*.17)}
.pf .cr{position:absolute;top:-25%;left:50%;width:52%;transform:translateX(-50%);fill:var(--g1);stroke:var(--g2);stroke-width:1.3;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #000a);animation:pfbob 2.6s ease-in-out infinite;z-index:2}
.pf .cr circle{fill:#fff;stroke:none}
.pf .wg{position:absolute;top:14%;width:48%;fill:var(--g1);stroke:var(--g2);stroke-width:1;opacity:.95;z-index:0;filter:drop-shadow(0 1px 3px #0009)}
.pf .wg.l{left:-40%;transform-origin:100% 60%;animation:pfflap 2.4s ease-in-out infinite}
.pf .wg.r{right:-40%;transform:scaleX(-1);transform-origin:100% 60%;animation:pfflap2 2.4s ease-in-out infinite}
.pf .gm{position:absolute;width:13%;height:13%;background:linear-gradient(135deg,#fff,var(--g1) 55%,var(--g2));transform:rotate(45deg);box-shadow:0 0 6px var(--g1);z-index:2;animation:pfpulse 1.8s ease-in-out infinite alternate}
.pf .sp{position:absolute;width:15%;height:15%;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px #fff);animation:pftw 1.7s ease-in-out infinite;z-index:3}
.pf .cdot{position:absolute;right:-3%;bottom:-3%;width:30%;height:30%;border-radius:50%;border:2px solid var(--gold);z-index:4;box-shadow:0 1px 4px #000a}
.pf .cdot.w{background:radial-gradient(circle at 35% 30%,#fff,#d9cfae)}.pf .cdot.b{background:radial-gradient(circle at 35% 30%,#555,#050505)}
@keyframes pfrot{to{transform:rotate(360deg)}}@keyframes pfhue{to{filter:hue-rotate(360deg)}}
@keyframes pfshine{55%,100%{transform:translateX(130%)}}@keyframes pfglow{from{opacity:.45}to{opacity:1}}
@keyframes pfbob{50%{transform:translateX(-50%) translateY(-6%)}}@keyframes pfpulse{to{filter:brightness(1.5);scale:1.15}}
@keyframes pfflap{50%{transform:rotate(-9deg)}}@keyframes pfflap2{50%{transform:scaleX(-1) rotate(-9deg)}}
@keyframes pftw{0%,100%{opacity:0;scale:.3}50%{opacity:1;scale:1}}
@media (prefers-reduced-motion:reduce){.pf *,.pf::before,.pf::after{animation:none!important}}

<script id="engine-src">/* DZY Chess engine — luật cờ (0x88) + tìm kiếm alpha-beta. Dùng chung cho giao diện và Web Worker. */
(function (G) {

  constructor(fen){this.load(fen||START);}
  load(fen){

    if(c.includes('q')&&has(4,-K)&&has(0,-R))this.castle|=8;

  computeHash(){

  // Ô en passant chỉ tính vào hash khi thực sự bắt được (đúng quy tắc lặp thế)

  fen(){

    if(cap){x(cap,capSq);b[capSq]=0;}

    const np=pr?us*pr:piece;b[to]=np;x(np,to);

  uci(m){return sqName(mFrom(m))+sqName(mTo(m))+(mPromo(m)?CHR[mPromo(m)]:'');}

          else if(!twins.some(o=>(mFrom(o)>>4)===(from>>4)))dis=sqName(from)[1];
          else dis=sqName(from);}
        s=CHR[t].toUpperCase()+dis+(cap?'x':'')+sqName(to);

  parseSan(s){

/* ---------- Đánh giá thế cờ (tapered) ---------- */
const VMG=[0,90,325,335,500,975,0],VEG=[0,115,300,320,530,950,0],PHASE=[0,0,1,1,2,4,0];

(function(){
  for(let t=1;t<=6;t++){PST_MG[t]=new Int16Array(64);PST_EG[t]=new Int16Array(64);

const pawnW=new Int8Array(10),pawnB=new Int8Array(10),rankW=new Int8Array(10),rankB=new Int8Array(10);

// Cùng giao diện với Mqtt nhưng chạy trên Firebase Realtime Database (REST + EventSource, không cần SDK).
// Mỗi thông điệp là một nút con {m,ts} dưới đường dẫn topic, tự xoá sau 15 giây; ts là giờ máy chủ Firebase.
class Fb{
  constructor(url,h){this.base=url.replace(/^fb:/,'').replace(/\/+$/,'');this.h=h;this.topics=new Set();this.es={};this.online=false;this.closed=false;this.seen=new Set();this.t0=0;}
  u(p){return this.base+'/'+p+'.json';}
  async connect(timeout){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout||8000);
    try{
      const id='c'+Math.random().toString(36).slice(2,10);
      const r=await fetch(this.u('dzy_clock/'+id),{method:'PUT',body:'{".sv":"timestamp"}',signal:ctl.signal});
      if(!r.ok)throw new Error('http '+r.status);
      this.t0=await r.json();
      fetch(this.u('dzy_clock/'+id),{method:'DELETE'}).catch(()=>{});
      if(typeof this.t0!=='number')throw new Error('clock');
    }catch(e){clearTimeout(tm);this.close();throw e;}

  }
  setUp(v){if(this.online===v)return;this.online=v;this.h.onState&&this.h.onState(v?'online':'offline');}
  subscribe(t){this.topics.add(t);if(!this.es[t]&&!this.closed)this.open(t);}
  open(t){
    const es=new EventSource(this.u(t));this.es[t]=es;
    const feed=(k,v)=>{
      if(!v||typeof v.m!=='string'||this.seen.has(k))return;
      this.seen.add(k);if(this.seen.size>600)this.seen=new Set([...this.seen].slice(-300));
      if(typeof v.ts==='number'&&v.ts<this.t0-2000)return;
      this.h.onMessage&&this.h.onMessage(t,v.m);
    };
    const on=ev=>{let d;try{d=JSON.parse(ev.data);}catch(e){return;}
      if(!d||typeof d.path!=='string')return;
      if(d.path==='/'){if(d.data&&typeof d.data==='object')Object.keys(d.data).sort().forEach(k=>feed(k,d.data[k]));}
      else{const p=d.path.split('/');if(p.length===2&&p[1])feed(p[1],d.data);}
    };
    es.addEventListener('put',on);es.addEventListener('patch',on);
    es.addEventListener('cancel',()=>{es.close();this.setUp(false);});
    es.onopen=()=>this.setUp(true);
    es.onerror=()=>{
      if(this.closed)return;this.setUp(false);
      if(es.readyState===2)setTimeout(()=>{if(!this.closed&&this.es[t]===es){delete this.es[t];this.open(t);}},2000);
    };
  }
  publish(t,msg){
    if(!this.online||this.closed)return false;
    fetch(this.u(t),{method:'POST',body:JSON.stringify({m:msg,ts:{'.sv':'timestamp'}}),keepalive:true})
      .then(r=>r.ok?r.json():Promise.reject())
      .then(j=>{if(j&&j.name)setTimeout(()=>fetch(this.u(t+'/'+j.name),{method:'DELETE'}).catch(()=>{}),15000);})
      .catch(()=>{});
    return true;
  }
  wake(){if(this.closed)return;for(const t of this.topics){const e=this.es[t];if(!e||e.readyState===2){delete this.es[t];this.open(t);}}}
  close(){this.closed=true;this.online=false;for(const t in this.es){try{this.es[t].close();}catch(e){}}this.es={};}
}

    this.bg.style.backgroundImage=`url("${A.board(this.opt.board)}")`;

  add(s,code){
    const node=el('pc',this.pcLayer),pi=el('pi',node);node.dataset.sq=E.sqName(s);node.dataset.code=code;
    pi.style.backgroundImage=`url("${A.piece(this.opt.set,code)}")`;

  // đồng bộ DOM với thế cờ (không tạo lại quân đã đúng chỗ)
  sync(pos){

      const want=pos.b[s]?CODE(pos.b[s]):null,have=this.pieces.get(s);

    }
  }
  reset(pos,intro){
    this.cancelDrag();this.pieces.clear();this.pcLayer.textContent='';this.fx.textContent='';this.sel=-1;this.sync(pos);
    if(intro&&this.opt.dur)this.pieces.forEach((p,s)=>p.pi.animate([{opacity:0,translate:'0 -35%',scale:.6},{opacity:1,translate:'0 0',scale:1}],{duration:360,delay:(s&7)*35+(s>>4)*12,fill:'backwards',easing:'ease-out'}));
  }
  slide(from,to){
    const p=this.pieces.get(from);if(!p)return;
    this.pieces.delete(from);this.pieces.set(to,p);p.node.dataset.sq=E.sqName(to);
    p.node.style.transition=this.opt.dur?`transform ${this.opt.dur}ms cubic-bezier(.3,.8,.3,1)`:'none';
    void p.node.offsetWidth;p.node.classList.add('moving');this.place(p.node,to);
    setTimeout(()=>p.node.classList.remove('moving'),this.opt.dur+20);
  }
  die(s){
    const p=this.pieces.get(s);if(!p)return;this.pieces.delete(s);
    const n=p.node;n.className='pc dead';
    if(!this.opt.dur){n.remove();return;}
    p.pi.animate([{opacity:1,scale:1,rotate:'0deg'},{opacity:.9,scale:1.25,offset:.3},{opacity:0,scale:.2,rotate:'55deg',filter:'brightness(2.5)'}],{duration:this.opt.dur+180,fill:'forwards'}).onfinish=()=>n.remove();
    setTimeout(()=>n.remove(),this.opt.dur+400);
    if(this.opt.effects){const b=el('burst',this.fx);this.place(b,s);for(let i=0;i<8;i++){const d=el('spark',b);d.style.setProperty('--a',i*45+'deg');}setTimeout(()=>b.remove(),600);}
  }
  // pos là thế cờ SAU nước đi m
  animate(m,pos,dragged){
    const from=E.mFrom(m),to=E.mTo(m),flag=E.mFlag(m);
    const dur=this.opt.dur;if(dragged)this.opt.dur=0;
    if(flag===E.F_EP)this.die(to+((to>>4)===2?16:-16));else if(this.pieces.has(to))this.die(to);
    this.slide(from,to);this.opt.dur=dur;
    if(flag===E.F_CASTLE){const rf=to>from?to+1:to-2,rt=to>from?to-1:to+1;this.slide(rf,rt);const r=this.pieces.get(rt);
      r&&dur&&r.pi.animate([{translate:'0 0'},{translate:'0 -45%',scale:1.15},{translate:'0 0'}],{duration:dur+160});}
    if(E.mPromo(m)){const p=this.pieces.get(to);const code=CODE(pos.b[to]);
      const swap=()=>{p.code=code;p.node.dataset.code=code;p.pi.style.backgroundImage=`url("${A.piece(this.opt.set,code)}")`;
        if(dur){p.pi.animate([{scale:.2,rotate:'-180deg',filter:'brightness(3) drop-shadow(0 0 14px gold)'},{scale:1.35,offset:.7},{scale:1,rotate:'0deg',filter:'none'}],{duration:520,easing:'ease-out'});}};
      p.code=code;setTimeout(swap,dragged?0:dur);}
    this.sync(pos);
  }
  // Xoay cả bàn 180° quanh tâm; quân và chữ toạ độ xoay ngược cùng nhịp nên cuối chuyển động trùng khít bố cục mới
  rotate(duration){
    this.cancelDrag();
    if(!duration||!this.spin.animate){this.setFlipped(!this.flipped);return Promise.resolve();}
    this.busy=true;this.root.classList.add('rotating');
    const opt={duration,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'};
    const tf=(x,z,s)=>`perspective(1100px) rotateX(${x}deg) rotateZ(${z}deg) scale(${s})`;
    const anims=[this.spin.animate([{transform:tf(0,0,1)},{transform:tf(28,90,.7)},{transform:tf(0,180,1)}],opt)];
    const counter=[{rotate:'0deg'},{rotate:'-90deg'},{rotate:'-180deg'}];
    this.pieces.forEach(p=>anims.push(p.pi.animate(counter,opt)));
    this.coords.forEach(c=>anims.push(c.animate(counter,opt)));
    return new Promise(res=>{let done=false;
      const finish=()=>{if(done)return;done=true;this.flipped=!this.flipped;this.layout();anims.forEach(a=>a.cancel());this.busy=false;this.root.classList.remove('rotating');res();};
      anims[0].onfinish=finish;setTimeout(finish,duration+250);});
  }
  mark({last,check,hint,mate}){
    this.marks={last,check,hint,mate};
    for(const s in this.squares){const c=this.squares[s].classList,n=+s;
      c.toggle('last',!!last&&last.includes(n));c.toggle('check',check===n);c.toggle('hint',!!hint&&hint.includes(n));c.toggle('mate',mate===n);}
    this.pieces.forEach((p,s)=>p.node.classList.toggle('mated',mate===s));
  }
  select(s){
    this.sel=s;
    const t=s>=0&&this.opt.legal?this.cb.targets(s):[];
    for(const k in this.squares){const n=+k,c=this.squares[k].classList;
      c.toggle('sel',n===s);c.toggle('legal',t.includes(n)&&!this.pieces.has(n));c.toggle('cap',t.includes(n)&&this.pieces.has(n));}
    this.pieces.forEach((p,k)=>p.node.classList.toggle('picked',k===s));
  }
  at(x,y){
    const r=this.grid.getBoundingClientRect();
    let c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
    if(c<0||c>7||w<0||w>7)return -1;
    if(this.flipped){c=7-c;w=7-w;}return w*16+c;
  }
  cancelDrag(){if(this.drag){const d=this.drag;this.drag=null;d.p.node.classList.remove('drag');d.p.node.style.transition='none';
    for(const[s,p]of this.pieces)if(p===d.p)this.place(p.node,s);}}
  bind(){
    const g=this.grid;
    g.addEventListener('pointerdown',e=>{
      if(this.busy||this.drag||e.button>0)return;e.preventDefault();

      if(this.pieces.has(s)&&this.cb.canPick(s)){
        const was=from===s;this.select(s);
        const p=this.pieces.get(s);

    });

      if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<7)return;
      d.moved=true;const r=g.getBoundingClientRect(),q=r.width/8;
      d.p.node.classList.add('drag');d.p.node.style.transition='none';
      d.p.node.style.transform=`translate(${e.clientX-r.left-q/2}px,${e.clientY-r.top-q/2}px)`;
    });
    const up=e=>{
      const d=this.drag;if(!d||e.pointerId!==d.id)return;this.drag=null;
      d.p.node.classList.remove('drag');this.place(d.p.node,d.s);
      const t=this.at(e.clientX,e.clientY);
      if(d.moved&&e.type==='pointerup'&&t!==d.s){
        const ok=t>=0&&this.cb.targets(d.s).includes(t);this.select(-1);
        if(ok)this.cb.onMove(d.s,t,true);else this.cb.onIllegal&&this.cb.onIllegal();
      }else if(!d.moved&&d.was)this.select(-1);
    };

  }
}

function loadMoves(g,moves){g.pos=new E.Position(g.startFen);g.moves=[];g.sans=[];for(const u of moves){const m=g.pos.parseUci(u);if(!m)break;g.sans.push(g.pos.san(m));g.pos.make(m);g.moves.push(u);}g.view=g.moves.length;}

  try{const g=newGame({mode:'offline',tc:s.tc,fen:s.startFen});g.names=s.names;g.id=s.id;loadMoves(g,s.moves);g.left=s.left;g.used=s.used;g.snaps=s.snaps||[];

function pgnOf(g){
  const r=g.result?g.result.score:'*',d=new Date().toISOString().slice(0,10).replace(/-/g,'.');
  const clean=s=>String(s).replace(/["\\\]\[]/g,'');
  let head=`[Event "DZY CHESS ${g.mode}"]\n[Site "DZY CHESS"]\n[Date "${d}"]\n[Round "-"]\n[White "${clean(g.names.w)}"]\n[Black "${clean(g.names.b)}"]\n[Result "${r}"]\n`;
  if(g.startFen!==E.START)head+=`[SetUp "1"]\n[FEN "${g.startFen}"]\n`;
  const p=new E.Position(g.startFen);let no=p.full,black=p.turn===-1,body='';
  g.sans.forEach((s,i)=>{if(!black)body+=no+'. ';else if(i===0)body+=no+'... ';body+=s+' ';if(black)no++;black=!black;});
  body+=r;
  return head+'\n'+body.replace(/(.{1,78})(\s|$)/g,'$1\n').trim()+'\n';
}
function parsePgn(text){
  const tags={};text=String(text).replace(/\r/g,'');
  text.replace(/^\s*\[(\w+)\s+"((?:[^"\\]|\\.)*)"\]\s*$/gm,(_,k,v)=>{tags[k]=v;return'';});
  let body=text.replace(/^\s*\[.*\]\s*$/gm,'').replace(/\{[^}]*\}/g,' ').replace(/;.*$/gm,' ');
  while(/\([^()]*\)/.test(body))body=body.replace(/\([^()]*\)/g,' ');
  const pos=new E.Position(tags.FEN||E.START),moves=[],sans=[];let result=tags.Result||'*';
  for(let tok of body.split(/\s+/)){
    tok=tok.replace(/^\d+\.(\.\.)?/,'');
    if(!tok||/^\$\d+$/.test(tok)||/^\.+$/.test(tok))continue;
    if(/^(1-0|0-1|1\/2-1\/2|\*)$/.test(tok)){result=tok;break;}
    const m=pos.parseSan(tok);if(!m)throw new Error(tok);
    sans.push(pos.san(m));moves.push(pos.uci(m));pos.make(m);
  }
  if(!moves.length&&!tags.FEN)throw new Error('trống');
  return{tags,moves,sans,result,startFen:tags.FEN||E.START};
}
App.parsePgn=parsePgn;App.pgnOf=pgnOf;
function record(g){
  if(!g.moves.length||['puzzle','analysis','replay','watch'].includes(g.mode))return;
  const h=store.get('history',[]).filter(x=>x.id!==g.id);
  h.unshift({id:g.id,date:Date.now(),mode:g.mode,white:g.names.w,black:g.names.b,result:g.result?g.result.score:'*',pgn:pgnOf(g)});

    const san=g.pos.san(m),mover=g.pos.turn===1?'w':'b';
    const capture=!!g.pos.b[E.mTo(m)]||E.mFlag(m)===E.F_EP;
    g.snaps[g.moves.length]={left:Object.assign({},g.left),used:Object.assign({},g.used)};
    g.pos.make(m);g.moves.push(uci);g.sans.push(san);g.view=g.moves.length;viewPos=g.pos;g.hint=null;g.seq++;
    if(timed&&g.moves.length>1)g.left[mover]+=g.tc.inc;
    if(!['analysis','replay','puzzle'].includes(g.mode))g.running=true;
    board.select(-1);board.animate(m,g.pos,opts.dragged);marks();
    const check=g.pos.inCheck();
    Snd.play(E.mPromo(m)?'promote':E.mFlag(m)===E.F_CASTLE?'castle':capture?'capture':'move');
    if(check&&!san.endsWith('#'))setTimeout(()=>Snd.play('check'),140);
    if(g.mode==='analysis'){const st=g.pos.status();ui();if(st.over)toast(resultText({score:st.result,reason:st.reason}));analyse();return true;}
    if(g.mode==='puzzle'){ui();return true;}
    const st=g.pos.status();
    if(st.over&&!watch&&!(online&&!g.isHost)){finish({score:st.result,reason:st.reason});return true;}
    save();ui();
    if(g.mode==='offline'){
      if(cfg.rot==='on'){
        const seq=g.seq;g.locked=true;ui();
        // chờ quân trượt xong rồi mới xoay
        setTimeout(()=>{if(App.game!==g||g.seq!==seq){return;}
          const want=g.pos.turn===-1;
          const done=()=>{g.flipped=board.flipped;g.locked=false;ui();};
          if(board.flipped===want)done();else board.rotate(dur(850)).then(done);
        },dur(230)+120);
      }else facing();
    }
    if(ai)aiTurn();
    if(g.mode==='training')analyse();
    return true;
  }
  function askPromotion(color,cb){
    const s=modal(`<h3>${t('promo')}</h3><div class="promo ${board.root.classList.contains('face-b')?'upside':''}">${['q','r','b','n'].map(p=>`<button data-p="${p}"><img alt="${p}" src="${A.piece(cfg.set,color+p)}"></button>`).join('')}</div>`,{onClose:()=>board.sync(viewPos)});
    $$('[data-p]',s).forEach(b=>b.onclick=()=>{modalClose=null;closeModal(true);cb(b.dataset.p);});
  }
  function userMove(from,to,dragged){
    if(!humanTurn())return;
    const list=viewPos.legalMoves().filter(m=>E.mFrom(m)===from&&E.mTo(m)===to);
    if(!list.length)return;
    const seq=g.seq;
    const send=uci=>{
      if(g.seq!==seq||!humanTurn()||App.game!==g)return;
      if(g.mode==='puzzle')return puzzleMove(uci,dragged);
      if(g.mode==='analysis'&&g.view!==g.moves.length){loadMoves(g,g.moves.slice(0,g.view));viewPos=g.pos;}
      if(play(uci,{dragged})&&online)App.Online.localMove(uci);
    };
    const base=E.sqName(from)+E.sqName(to);
    if(E.mPromo(list[0]))askPromotion(viewPos.turn===1?'w':'b',p=>send(base+p));else send(base);
  }
  function aiTurn(){
    if(g.result||(g.pos.turn===1?'w':'b')===g.human)return;
    const seq=g.seq;g.thinking=true;ui();
    let time=[0,150,600,2600][g.level];
    if(timed){const c=g.pos.turn===1?'w':'b';time=Math.max(60,Math.min(time,g.left[c]/28+g.tc.inc*.6));}
    const opts={time,book:g.level===3&&g.startFen===E.START};
    if(g.level<3)opts.depth=g.level===1?1:4;
    const bc=g.bot?G.DZYBots.cfg(g.bot.elo):null;
    if(bc){opts.depth=bc.depth;opts.time=Math.min(bc.time,time||bc.time);opts.book=bc.book&&g.startFen===E.START;}
    const t0=Date.now();
    AI.think(g.startFen,g.moves.slice(),opts).then(r=>{
      setTimeout(()=>{if(App.game!==g||g.seq!==seq||g.result||!r)return;
        let move=r.move;
        if((g.level===1&&!bc&&Math.random()<.35)||(bc&&Math.random()<bc.blunder)){const l=g.pos.legalMoves();move=g.pos.uci(l[Math.random()*l.length|0]);}
        g.thinking=false;if(modalClose===null&&$('#modal').className)closeModal(true);play(move);
      },Math.max(0,(bc?bc.delay():Math.max(450,dur(300)))-(Date.now()-t0)));
    }).catch(e=>{g.thinking=false;toast('AI: '+e.message,'err');ui();});
  }
  let evalTimer=null;
  function analyse(){
    const box=$('#evalbox',sec);if(!box)return;
    if(g.mode==='training'&&!cfg.hints){box.textContent='';return;}
    clearTimeout(evalTimer);const n=g.view,seq=g.seq;
    evalTimer=setTimeout(()=>{
      if(g.mode==='training'&&(g.thinking||g.result))return;
      const p=posAt(n),st=p.status();
      if(st.over&&(st.reason==='mate'||st.reason==='stalemate')){box.textContent=t('r_'+st.reason);return;}
      box.textContent=t('eval')+': …';
      AI.think(g.startFen,g.moves.slice(0,n),{time:g.mode==='training'?500:1500}).then(r=>{
        if(App.game!==g||g.view!==n||g.seq!==seq||!r)return;
        const sg=p.turn,score=r.mate?(r.mate*sg>0?'+':'−')+'M'+Math.abs(r.mate):((r.score*sg)/100>=0?'+':'')+((r.score*sg)/100).toFixed(2);
        box.innerHTML=`<b>${t('eval')} ${score}</b> <small>d${r.depth}</small><div>${t('best')}: ${esc(r.pv.join(' '))}</div>`;
      }).catch(()=>{});
    },g.mode==='training'?900:250);
  }
  function puzzleMove(uci,dragged){
    const p=g.pos,m=p.parseUci(uci);p.make(m);
    const replies=p.legalMoves(),n=g.puzzle.left;
    const good=!replies.length?p.inCheck():n>1&&replies.every(r=>{p.make(r);const f=E.forcedMate(p,n-1);p.unmake();return !!f;});
    p.unmake();
    if(!good){Snd.play('illegal');toast(t('puzzle_no'),'err');board.reset(g.pos);marks();return;}
    play(uci,{dragged});g.puzzle.left--;
    if(!replies.length){g.puzzle.solved=true;Snd.play('win');confetti('win');toast(t('puzzle_ok'),'ok');ui();return;}
    g.thinking=true;const seq=g.seq;
    setTimeout(()=>{if(App.game!==g||g.seq!==seq)return;g.thinking=false;const r=replies[0];play(g.pos.uci(r));},550);
  }
  function undo(){
    if(!g.moves.length)return;
    let n=1;
    if(ai){const turn=g.pos.turn===1?'w':'b';n=turn===g.human?2:1;if(g.moves.length<n)return;AI.stop();}
    for(let i=0;i<n;i++){g.pos.unmake();g.moves.pop();g.sans.pop();const s=g.snaps[g.moves.length];if(s){g.left=Object.assign({},s.left);g.used=Object.assign({},s.used);}}
    g.result=null;g.thinking=false;g.hint=null;g.seq++;g.view=g.moves.length;g.locked=false;board.root.classList.remove('mating');
    if(!g.moves.length)g.running=false;else if(g.mode!=='analysis')g.running=true;
    g.last=Date.now();
    if(g.mode==='offline'&&cfg.rot==='on'){const want=g.pos.turn===-1;board.setFlipped(want);g.flipped=want;}
    render();save();
    if(ai)aiTurn();if(g.mode==='analysis'||g.mode==='training')analyse();
  }
  let autoOn=false,autoBusy=false,autoTimer=null;
  /* Admin: máy tự đánh thay người chơi ở mức mạnh nhất của engine (nghĩ tối đa ~5 giây/nước, có sách khai cuộc) */
  function autoStep(){
    if(!autoOn||autoBusy||App.game!==g){if(App.game!==g)clearInterval(autoTimer);return;}
    if(g.result||g.thinking||!humanTurn())return;
    autoBusy=true;const seq=g.seq,c=g.pos.turn===1?'w':'b';let tm=5000;
    if(timed)tm=Math.max(120,Math.min(tm,g.left[c]/20+g.tc.inc*.6));
    AI.think(g.startFen,g.moves.slice(),{time:tm,book:g.startFen===E.START}).then(r=>{
      autoBusy=false;
      if(!autoOn||App.game!==g||g.seq!==seq||g.result||!r||!humanTurn())return;
      const mv=r.move;if(play(mv)&&online)App.Online.localMove(mv);
    }).catch(()=>{autoBusy=false;});
  }
  let auto=null;
  function stopAuto(){if(auto){clearInterval(auto);auto=null;const b=$('[data-a="auto"]',sec);if(b){b.firstChild.innerHTML=DI('play',20);b.lastChild.textContent=t('play');}}}
  function view(n,animate){
    n=Math.max(0,Math.min(g.moves.length,n));if(n===g.view)return;
    const step=n===g.view+1&&animate!==false;
    g.view=n;
    if(step){const p=E.replay(g.startFen,g.moves.slice(0,n-1)),m=p.parseUci(g.moves[n-1]),cap=!!p.b[E.mTo(m)];p.make(m);viewPos=p;board.select(-1);board.animate(m,p);marks();ui();Snd.play(cap?'capture':'move');}
    else render(true);
    if(g.mode==='analysis')analyse();
  }
  const started=()=>g.moves.length>(g.human==='w'?0:1);
  function forfeit(){if(g.bot&&!g.result&&started())finish({score:g.human==='w'?'0-1':'1-0',reason:'resign'});}
  function leave(){
    if(g.bot&&!g.result&&started()){confirmBox('Rời ván bây giờ sẽ bị xử thua. Bạn chắc chứ?',null,()=>{forfeit();go('home');});return;}
    if(online&&!g.result&&g.moves.length){confirmBox(t('q_leave'),null,()=>{App.Online.leave();go('home');});return;}
    if(online||watch)App.Online.leave();
    go(g.mode==='replay'?'history':'home');
  }
  const ACT={
    menu:leave,
    undo(){if(isAdm||g.mode==='analysis')undo();},
    new:()=>{const go2=()=>{if(g.bot){forfeit();go('match');}else startGame({mode:g.mode,tc:g.tc,color:g.human,level:g.level});};if(g.moves.length&&!g.result)confirmBox(t('newgame')+'?',null,go2);else go2();},
    autoplay(){if(!canAuto)return;autoOn=!autoOn;const b=$('[data-a="autoplay"]',sec);b&&b.classList.toggle('on',autoOn);
      clearInterval(autoTimer);if(autoOn){autoTimer=setInterval(autoStep,800);autoStep();}
      toast(autoOn?'Tự đánh: BẬT · mức mạnh nhất':'Tự đánh: TẮT','ok');},
    hint(){
      if(!canHint)return;
      const seq=g.seq,b=$('[data-a="hint"]',sec);b.classList.add('busy');
      AI.think(g.startFen,g.moves.slice(),{time:900}).then(r=>{b.classList.remove('busy');if(App.game!==g||g.seq!==seq||!r)return;g.hint=[E.sqIndex(r.move.slice(0,2)),E.sqIndex(r.move.slice(2,4))];marks();toast(t('hint')+': '+r.pv[0],'ok');});
    },
    draw(){
      const c=ai||online?g.human:(g.pos.turn===1?'w':'b'),seq=g.seq;
      if(online){App.Online.offerDraw();return;}
      if(ai){
        AI.stop();
        AI.think(g.startFen,g.moves.slice(),{time:600}).then(r=>{
          if(App.game!==g||g.seq!==seq||!r)return;
          const aiScore=(g.pos.turn===1?'w':'b')===g.human?-r.score:r.score;
          if(aiScore<-80||(Math.abs(aiScore)<30&&g.moves.length>80))finish({score:'1/2-1/2',reason:'agree'});
          else{toast(t('ai_decline'));if(g.thinking){g.thinking=false;aiTurn();}}
        });return;
      }
      confirmBox(t('q_draw',g.names[c],g.names[other(c)]),t('accept'),()=>finish({score:'1/2-1/2',reason:'agree'}),null,t('decline'));
    },
    resign(){
      const c=ai||online?g.human:(g.pos.turn===1?'w':'b');
      confirmBox(t('q_resign',g.names[c]),t('resign'),()=>{if(online){App.Online.resign();return;}finish({score:c==='w'?'0-1':'1-0',reason:'resign'});});
    },
    flip(){board.rotate(dur(700)).then(()=>{g.flipped=board.flipped;ui();});},
    chat(){const c=$('#chat',sec);c.hidden=!c.hidden;sec.classList.toggle('chatting',!c.hidden);Snd.play(c.hidden?'close':'open');
      const b=$('[data-a="chat"]',sec);b.classList.remove('badge');if(!c.hidden){const m=$('#msgs',sec);m.scrollTop=m.scrollHeight;}},
    sound(){cfg.sound=!cfg.sound;saveCfg();$('[data-a="sound"]',sec).classList.toggle('off',!cfg.sound);if(cfg.sound)Snd.play('click');},
    pgn(){
      const text=pgnOf(g);
      const s=modal(`<h3>PGN</h3><textarea readonly rows="9">${esc(text)}</textarea><div class="row"><button class="btn ghost" data-c>${t('copypgn')}</button><button class="btn" data-d>${t('download')}</button></div>`);
      $('[data-c]',s).onclick=()=>copyText(text);$('[data-d]',s).onclick=()=>download('dzy-chess-'+g.id+'.pgn',text);
    },
    settings(){const s=modal(`<h3>${t('settings')}</h3><div class="setlist">${settingsHtml(true)}</div><button class="btn wide" data-x>${t('close')}</button>`,{onClose:applyLive});
      bindSettings(s,applyLive);$('[data-x]',s).onclick=()=>closeModal();},
    retry:()=>startGame({mode:'puzzle',index:g.puzzle.i}),
    next:()=>startGame({mode:'puzzle',index:g.puzzle.i+1}),
    auto(){
      if(auto)return stopAuto();
      if(g.view===g.moves.length)view(0);
      const b=$('[data-a="auto"]',sec);b.firstChild.innerHTML=DI('pause',20);b.lastChild.textContent=t('pause');
      auto=setInterval(()=>{if(g.view>=g.moves.length)return stopAuto();view(g.view+1);},Math.round(900/cfg.speed));
    },
    fen(){
      const s=modal(`<h3>FEN</h3><textarea rows="3" data-f placeholder="${t('fen')}">${esc(viewPos.fen())}</textarea><div class="row"><button class="btn ghost" data-c>${t('copypgn')}</button><button class="btn" data-l>${t('load')}</button></div>`);
      $('[data-c]',s).onclick=()=>copyText($('[data-f]',s).value);
      $('[data-l]',s).onclick=()=>{try{const f=$('[data-f]',s).value.trim();new E.Position(f);closeModal(true);startGame({mode:'analysis',fen:f});}catch(e){toast(t('bad_fen'),'err');}};
    }
  };
  function applyLive(){boardCfg();if(g.mode==='offline'){const want=cfg.rot==='on'&&g.pos.turn===-1;board.setFlipped(want);g.flipped=want;}
    if(!cfg.hints)g.hint=null;const b=$('[data-a="sound"]',sec);b&&b.classList.toggle('off',!cfg.sound);marks();facing();ui();size();}
  sec.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]'),n=e.target.closest('[data-n]'),ply=e.target.closest('[data-ply]'),emo=e.target.closest('[data-emo]');
    if(a&&!a.disabled)ACT[a.dataset.a]&&ACT[a.dataset.a]();
    if(n){stopAuto();view({first:0,prev:g.view-1,next:g.view+1,last:g.moves.length}[n.dataset.n]);}
    if(ply){stopAuto();view(+ply.dataset.ply,false);}
    if(emo){const i=$('#chatin',sec);i.value+=emo.dataset.emo;i.focus();}
  });
  const form=$('#chatform',sec);
  if(form)form.onsubmit=e=>{e.preventDefault();const i=$('#chatin',sec),v=i.value.trim();if(!v)return;if(App.Online.chat(v))i.value='';else toast(t('net_lost'),'err');};

  // giao diện cho lớp online
  g.api={
    play,finish,render,ui,
    rebuild(moves){loadMoves(g,moves);g.seq++;g.hint=null;viewPos=g.pos;render(true);},
    clearResult(){g.result=null;board.root.classList.remove('mating');closeModal(true);ui();},
    banner(text){const b=$('#banner',sec);b.hidden=!text;b.textContent=text||'';},
    chat(msg,mine){
      const box=$('#msgs',sec);if(!box)return;
      const d=document.createElement('div');d.className='msg'+(mine?' mine':'');
      const who=document.createElement('small');who.textContent=msg.name+' · '+new Date(msg.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      const body=document.createElement('p');body.innerHTML=STKT(esc(msg.text));d.append(who,body);box.appendChild(d);box.scrollTop=box.scrollHeight;
      if(!mine){Snd.play('message');if($('#chat',sec).hidden){$('[data-a="chat"]',sec).classList.add('badge');toast(msg.name+': '+msg.text.slice(0,60));}}
    }
  };

  board.reset(g.pos,true);viewPos=g.pos;
  if(g.mode==='replay'){g.view=0;viewPos=posAt(0);board.reset(viewPos,true);}
  marks();facing();ui();size();requestAnimationFrame(size);
  Snd.play('start');
  if(ai)aiTurn();
  if(g.mode==='analysis')analyse();
  App.cleanup=()=>{clearInterval(timer);clearTimeout(evalTimer);stopAuto();clearInterval(autoTimer);autoOn=false;ro&&ro.disconnect();removeEventListener('resize',size);
    tick();g.running=false;if(g.mode==='offline')save();AI.stop();g.thinking=false;g.seq++;App.game=null;App.board=null;};
};

function settingsHtml(){
  const tog=k=>`<label class="set"><span>${t('s_'+k.toLowerCase())}</span><input type="checkbox" class="sw" data-k="${k}" ${cfg[k]?'checked':''}></label>`;
  const rng=(k,label,min,max,step)=>`<label class="set"><span>${label}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${cfg[k]}"></label>`;
  const sel=(k,label,opts)=>`<label class="set"><span>${label}</span><select data-k="${k}">${opts.map(([v,l])=>`<option value="${v}" ${cfg[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
  const ow=(k,id)=>{try{return Own.owned(Auth.cur(),k,id);}catch(e){return true;}};
  return sel('board',t('board'),Object.entries(A.BOARDS).filter(([k])=>ow('b',k)).map(([k,v])=>[k,v[0]]))+sel('set',t('pieces'),Object.entries(A.SETS).filter(([k])=>ow('s',k)).map(([k,v])=>[k,v.n]))
  +tog('sound')+rng('fxVol',t('s_fxvol'),0,1,.05)+rng('uiVol',t('s_uivol'),0,1,.05)+tog('music')+tog('effects')+rng('speed',t('s_speed'),.5,2,.25)+tog('reduce')
  +sel('coords',t('s_coords'),[['out',t('c_out')],['in',t('c_in')],['none',t('c_none')]])+sel('input',t('s_input'),[['both',t('i_both')],['tap',t('i_tap')],['drag',t('i_drag')]])
  +tog('hints')+tog('legal')+sel('rot',t('s_rot'),[['on',t('rot_on')],['face',t('rot_face')],['off',t('rot_off')]])+`<p class="note">${t('s_rot_help')}</p>`
  +sel('lang',t('s_lang'),[['vi','Tiếng Việt'],['en','English']]);
}
function bindSettings(root,after){
  $$('[data-k]',root).forEach(i=>i.addEventListener(i.type==='range'?'input':'change',()=>{
    const k=i.dataset.k;cfg[k]=i.type==='checkbox'?i.checked:i.type==='range'?Number(i.value):i.value;saveCfg();
    if(k==='fxVol')Snd.play('move');if(k==='uiVol')Snd.play('click');
    after&&after(k);
  }));
}

/* ---------- tài khoản: đăng nhập / đăng ký ----------
   Hiện lưu trên thiết bị (localStorage). Mọi thao tác đi qua đối tượng Auth,
   sau này chỉ cần thay thân hàm bằng gọi API máy chủ là xong. */
const Auth=(function(){
  const ADMINK='keyadmin216',ADMIN_SALT='dz9k2x',ADMIN_H=['c157f1b5b05d98300a51ff206d98e7ce373c5f9ae0d341dc6bf5f46667a30f0d','f849d9c222b5d54e7be09b083c699ff13'];let adminOK=false;
  const lc=u=>String(u).trim().toLowerCase();
  const users=()=>store.get('users',{});
  const save=o=>store.set('users',o);
  function fb(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
    h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16);}
  async function hash(pw,salt){const str=salt+':'+pw;
    try{if(G.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
    return 'f'+fb(str)+fb(str+salt);}
  const rnd=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  let fails={};
  const A_={
    async init(){const o=users();
      const a=o[ADMINK]||{u:ADMINK,elo:1200,token:0,created:Date.now()};a.u=ADMINK;a.role='admin';a.salt=ADMIN_SALT;a.ph=ADMIN_H[0];o[ADMINK]=a;save(o);
      const c=store.get('session',null);if(c&&(!o[c]||c===ADMINK))store.del('session');
      this.sync();},
    cur(){const c=store.get('session',null);const r=c&&users()[c];if(!r)return null;
      if(r.role==='admin'&&!(c===ADMINK&&adminOK))return Object.assign({},r,{role:'user'});return r;},
    sync(){const u=this.cur();if(u&&cfg.name!==u.u){cfg.name=u.u;store.set('settings',cfg);}},
    async register(name,pw){
      name=String(name).trim();
      if(!/^[A-Za-z0-9_]{3,16}$/.test(name))throw new Error('Tên đăng nhập 3–16 ký tự: chữ không dấu, số hoặc _');
      if(pw.length<6)throw new Error('Mật khẩu cần ít nhất 6 ký tự');
      if(pw.length>64)throw new Error('Mật khẩu quá dài');
      if(lc(name)===ADMINK||/admin/i.test(name)||(G.DZYBots&&G.DZYBots.is(name)))throw new Error('Tên đăng nhập đã có người dùng');
      const o=users();if(o[lc(name)])throw new Error('Tên đăng nhập đã có người dùng');
      const salt=rnd();o[lc(name)]={u:name,salt,ph:await hash(pw,salt),role:'user',elo:1200,token:0,created:Date.now()};save(o);
      store.set('session',lc(name));this.sync();return o[lc(name)];},
    async login(name,pw){
      const k=lc(name),f=fails[k]||{n:0,t:0};
      if(f.n>=5&&Date.now()-f.t<30000)throw new Error('Sai quá nhiều lần, thử lại sau '+Math.ceil((30000-(Date.now()-f.t))/1000)+'s');
      const r=users()[k];
      const hh=r?await hash(pw,k===ADMINK?ADMIN_SALT:r.salt):'';if(!r||(k===ADMINK?!ADMIN_H.includes(hh):hh!==r.ph)){fails[k]={n:(f.n%5)+1,t:Date.now()};throw new Error('Sai tên đăng nhập hoặc mật khẩu');}
      delete fails[k];if(k===ADMINK)adminOK=true;store.set('session',k);this.sync();return r;},
    logout(){adminOK=false;store.del('session');}
  };
  return A_;
})();

/* ---------- QUYỀN DO ADMIN CẤP: tự đánh · gợi ý · theo dõi · duyệt Token — dzy_perms/<user>/<quyền> ----------
   Admin luôn có đủ quyền. Tài khoản thường chỉ có khi được admin cấp; bản sao lưu cục bộ để dùng tức thì. */
const Perm=(function(){
  const b0=G.DZYNet.brokerList()[0],DB=/^fb:/.test(b0)?b0.slice(3).replace(/\/+$/,''):null,lc=u=>String(u).trim().toLowerCase();
  const KEYS=[['auto','Tự đánh'],['hint','Gợi ý'],['watch','Theo dõi'],['pay','Duyệt Token']],ID=/^[A-Za-z0-9_]{3,16}$/;
  const api=(p,m,b)=>fetch(DB+'/'+p+'.json',{method:m||'GET',body:b==null?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error('Máy chủ lỗi '+r.status);return r.json();});
  const mine=()=>{const m=Auth.cur();return m?store.get('perm.'+lc(m.u),{}):{};};
  const P={KEYS,
    has(k){const m=Auth.cur();if(!m)return false;if(m.role==='admin')return true;return !!mine()[k];},
    async all(){if(!DB)throw new Error('Chưa kết nối máy chủ');return (await api('dzy_perms'))||{};},
    async set(u,k,on){const m=Auth.cur();if(!m||m.role!=='admin')throw new Error('Chỉ admin');if(!DB)throw new Error('Chưa kết nối máy chủ');
      if(!ID.test(u)||!KEYS.some(x=>x[0]===k))throw new Error('Tên tài khoản không hợp lệ');
      await api('dzy_perms/'+lc(u)+'/'+k,on?'PUT':'DELETE',on?true:null);},
    async pull(){const m=Auth.cur();if(!m||!DB||m.role==='admin')return false;
      try{const o=(await api('dzy_perms/'+lc(m.u)))||{},n={};KEYS.forEach(([k])=>{if(o[k]===true)n[k]=1;});
        if(JSON.stringify(n)===JSON.stringify(mine()))return false;store.set('perm.'+lc(m.u),n);return true;}catch(e){return false;}}
  };
  setInterval(()=>{if(!document.hidden)P.pull();},8000);
  return P;
})();

    ['KBHCM','Kookmin Bank HCM','Kookmin – CN TP.HCM','970463','#8a6a1a'],
    ['CAKE','Cake','Cake by VPBank','546034','#e0368a'],
    ['UBANK','Ubank','Ubank by VPBank','546035','#1a8f6a'],
    ['TIMO','Timo','Timo by Bản Việt','963388','#6a3fd0'],
    ['VTMONEY','Viettel Money','Ví Viettel Money','971005','#e0202a'],
    ['VNPT','VNPT Money','Ví VNPT Money','971011','#0a6fb5'],
    ['LIO','Liobank','Liobank by OCB','963369','#f06a1c']
  ];
  const bankOf=bin=>BANKS.find(b=>b[3]===String(bin))||null;
  const norm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
  const cfgGet=()=>Object.assign({},DEF,store.get('paycfg',{}));
  let off=0,clk=false,pending=[],seen=new Set(),tk=0;
  async function api(p,m,b){if(!DB)throw new Error('Chưa có kết nối máy chủ');
    const r=await fetch(DB+'/'+p+'.json',{method:m||'GET',body:b==null?undefined:JSON.stringify(b)});
    if(!r.ok)throw new Error('Máy chủ lỗi '+r.status);return r.json();}
  async function sync(){if(clk)return;const id='p'+Math.random().toString(36).slice(2,8);
    const ts=await api('dzy_clock/'+id,'PUT',{'.sv':'timestamp'});api('dzy_clock/'+id,'DELETE').catch(()=>{});
    if(typeof ts==='number'){off=ts-Date.now();clk=true;}}
  const now=()=>Date.now()+off;
  function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,'0');}
  const tl=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  function payload(amt,msg){const c=cfgGet();
    const mer=tl('00','A000000727')+tl('01',tl('00',c.bin)+tl('01',c.acct))+tl('02','QRIBFTTA');
    const s=tl('00','01')+tl('01','12')+tl('38',mer)+tl('53','704')+tl('54',String(amt))+tl('58','VN')+tl('62',tl('08',msg))+'6304';return s+crc(s);}
  const rid=n=>Array.from({length:n},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
  async function list(){const o=await api('dzy_topup')||{};return Object.entries(o).filter(([k,v])=>v&&typeof v==='object').map(([k,v])=>Object.assign({id:k},v));}
  function upd(name,fn){const o=store.get('users',{}),r=o[lc(name)];if(!r)return null;fn(r);store.set('users',o);return r;}
  function addLocal(name,a,w,id){return upd(name,r=>{r.token=Math.max(0,(r.token||0)+a);if(w==='topup')r.dep=(r.dep||0)+a;
    (r.applied=r.applied||[]).push(id);r.applied=r.applied.slice(-200);(r.log=r.log||[]).unshift({t:Date.now(),a,w});r.log=r.log.slice(0,30);});}
  function refreshBal(){const me=Auth.cur();if(!me)return;const v=fmt(me.token);
    $$('.coinchip span').forEach(e=>e.textContent=v);const w=$('#wbal');if(w)w.textContent=v;}
  async function pullCredits(){const me=Auth.cur();if(!me||!DB)return;
    const o=await api('dzy_credit/'+lc(me.u));if(!o)return;let sum=0;
    for(const [id,v] of Object.entries(o)){if(!v||typeof v.a!=='number')continue;
      if(!(me.applied||[]).includes(id)){const r=addLocal(me.u,v.a,v.w,id);if(r){sum+=v.a;me.applied=r.applied;}}
      api('dzy_credit/'+lc(me.u)+'/'+id,'DELETE').catch(()=>{});}
    if(sum){refreshBal();Snd.play('win');toast((sum>0?'+':'')+fmt(sum)+' Token đã vào tài khoản','ok');}}
  async function poll(){const me=Auth.cur();if(!me||!DB)return;
    await sync();
    const l=await list();
    for(const r of l)if(!(now()-r.ts<=TTL))api('dzy_topup/'+r.id,'DELETE').catch(()=>{});   // quét mã quá 10 phút
    if(!Perm.has('pay'))return;
    pending=l.filter(r=>r.st==='p'&&now()-r.ts<=TTL).sort((a,b)=>a.ts-b.ts);
    for(const r of pending)if(!seen.has(r.id)){seen.add(r.id);Snd.play('message');toast(r.u+' nạp '+fmt(r.amt)+'₫ — chờ duyệt','ok');}
    $$('.coinchip i,#apbadge').forEach(e=>{e.textContent=pending.length;e.style.display=pending.length?'':'none';});
    P.onList&&P.onList();}
  const P={fmt,cfgGet,payload,now,TTL,DEF,BANKS,bankOf,norm,
    get pending(){return pending;},onList:null,refreshBal,pullCredits,
    price(){return cfgGet().price;},
    async myPending(){const me=Auth.cur();await sync();return (await list()).find(r=>lc(r.u)===lc(me.u)&&r.st==='p'&&now()-r.ts<=TTL)||null;},
    async create(amt){const me=Auth.cur();await sync();
      if(await P.myPending())throw new Error('Bạn đang có một mã chưa hết hạn');
      const id=rid(6);await api('dzy_topup/'+id,'PUT',{u:me.u,amt,ts:{'.sv':'timestamp'},st:'p'});
      const r=await api('dzy_topup/'+id);return {id,amt,ts:r.ts,st:'p',u:me.u};},
    status:id=>api('dzy_topup/'+id),
    async approve(r){if(!(now()-r.ts<=TTL))throw new Error('Mã đã hết hạn');
      await api('dzy_credit/'+lc(r.u)+'/'+r.id,'PUT',{a:r.amt,w:'topup',ts:now()});await api('dzy_topup/'+r.id,'PATCH',{st:'ok'});},
    reject:r=>api('dzy_topup/'+r.id,'PATCH',{st:'no'}),
    async grant(u,a){u=lc(u);const id='g'+rid(7);
      try{await api('dzy_credit/'+u+'/'+id,'PUT',{a,w:'admin',ts:now()});}
      catch(e){if(!addLocal(u,a,'admin',id))throw e;refreshBal();return 'local';}
      pullCredits().catch(()=>{});return 'server';},
    async setCfg(o){const c=Object.assign(cfgGet(),o);store.set('paycfg',c);await api('dzy_cfg','PUT',c);},
    async pullCfg(){const c=await api('dzy_cfg');if(!c||typeof c!=='object')return;const o={};
      if(+c.price>0)o.price=Math.round(+c.price);if(/^\d{6}$/.test(c.bin||''))o.bin=c.bin;if(/^\w{6,30}$/.test(c.acct||''))o.acct=c.acct;store.set('paycfg',o);},
    start(){setInterval(()=>{if(!Auth.cur())return;tk++;
      if(tk%2===0)pullCredits().catch(()=>{});if(tk%7===1)P.pullCfg().catch(()=>{});poll().catch(()=>{});},3000);}
  };
  return P;
})();
G.DZYPay=Pay;Pay.start();

function qrModal(req){
  const c=Pay.cfgGet(),F=Pay.fmt,msg='DZY'+req.id;let t1,k=0,done=false;
  const s=modal(`<div class="qrbox"><h3>Nạp ${F(req.amt)} Token</h3>
   <div class="qrw"><div class="qrimg">${G.DZYNet.qrSvg(Pay.payload(req.amt,msg))}<i class="scan"></i></div><div class="okmark">${DI('check',48)}</div></div>
   <div class="qtimer"><i id="qbar"></i></div><p id="qt" class="qt">Còn 10:00 để admin duyệt</p>
   <div class="qinfo"><div><small>ZaloPay</small><b>${esc(c.acct)}</b></div><div><small>Số tiền</small><b>${F(req.amt)}₫</b></div><div><small>Nội dung</small><b>${msg}</b></div></div>
   <p class="hint">Quét bằng ZaloPay hoặc app ngân hàng. Chuyển đúng số tiền & nội dung, admin sẽ nhận thông báo và duyệt trong 10 phút, quá hạn mã tự xoá.</p>
   <div class="row"><button class="btn ghost" data-c>Đóng</button><button class="btn" data-k>Chép nội dung</button></div></div>`,{sticky:true,onClose:()=>clearInterval(t1)});
  $('[data-c]',s).onclick=()=>closeModal();$('[data-k]',s).onclick=()=>copyText(msg).then(()=>toast('Đã chép '+msg,'ok'));
  const end=(txt,cls)=>{done=true;clearInterval(t1);$('#qt',s).textContent=txt;s.classList.add(cls);};
  t1=setInterval(async()=>{if(done)return;const left=Pay.TTL-(Pay.now()-req.ts);
    if(left<=0)return end('Mã đã hết hạn và bị xoá','exp');
    const m=Math.floor(left/60000),sc=Math.floor(left/1000)%60;
    $('#qt',s).textContent='Còn '+m+':'+String(sc).padStart(2,'0')+' để admin duyệt';$('#qbar',s).style.width=(left/Pay.TTL*100)+'%';
    if(++k%3===0){try{const r=await Pay.status(req.id);if(done)return;
      if(!r)return end('Mã đã hết hạn và bị xoá','exp');
      if(r.st==='ok'){Snd.play('win');Pay.pullCredits().catch(()=>{});confetti&&confetti('win');end('Nạp thành công! +'+F(req.amt)+' Token','good');}
      else if(r.st==='no')end('Admin đã từ chối mã này','bad');}catch(e){}}},1000);
}

    catch(x){err('#age',x.message);}};

  const VIPT=[0,10000,50000,100000,200000,500000,1000000];

    if(e)return{u:e.u||n,role:k==='keyadmin216'?'admin':'user',dep:e.dep||0,elo:e.elo,pf:{av:e.av,fr:e.fr}};

  const level=r=>{if(!r)return 0;if(r.role==='admin')return 7;let l=0;VIPT.forEach((v,i)=>{if((r.dep||0)>=v)l=i;});return l;};
  const AV=[

   ['a7','Mã Băng','conic-gradient(from 200deg at 50% 60%,#e0f7ff,#6cc6ff,#2c5fd6,#e0f7ff)','wn',2],
   ['a8','Hậu Đêm','radial-gradient(1.5px 1.5px at 20% 25%,#fff,#0000),radial-gradient(1.5px 1.5px at 78% 22%,#fff,#0000),radial-gradient(1px 1px at 62% 78%,#fff,#0000),radial-gradient(circle at 50% 40%,#3b2a73,#07050e 80%)','bq',2],
   ['a9','Vua Huyết','radial-gradient(circle at 50% 30%,#ff7a8e,#5a0716 85%)','bk',3],
   ['a10','Thiên Hà','radial-gradient(circle at 28% 28%,#ff9ad5aa,#0000 55%),radial-gradient(circle at 76% 72%,#6cc6ffaa,#0000 55%),radial-gradient(circle,#2a1a66,#07050e)','wb',4],
   ['a11','Xe Hoàng Kim','conic-gradient(from 0deg,#ffe08a,#b07a12,#fff1a8,#8a5a0a,#ffe08a)','wr',5],

   {id:'f0',n:'Tân thủ',t:0,c:['#8d86a6','#5f5877','#8d86a6','#4a4560'],w:7,sp:0,d:''},

   {id:'f2',n:'Bạc',t:2,c:['#ffffff','#9fb0c7','#e8eef7','#6f7f96'],w:10,sp:7,d:'gems sh'},
   {id:'f3',n:'Vàng',t:3,c:['#fff1a8','#e8b84a','#fff6c8','#b07a12'],w:11,sp:6,d:'gems sh crown glow'},
   {id:'f4',n:'Bạch kim',t:4,c:['#c9fff6','#4fd1c5','#f0fffc','#2b8a9e'],w:12,sp:5,d:'gems sh crown glow spark'},

   {id:'fA',n:'Đế vương',t:99,c:['#ff5470','#ffe08a','#ff5470','#ffd36b','#ffffff','#ffd36b'],w:14,sp:2.2,d:'gems sh crown wings glow spark ring2 hue halo'}
  ];
  const can=(r,it)=>!!r&&(it.t===99?r.role==='admin':(r.role==='admin'||level(r)>=it.t));

    return{av,fr};}
  const WING='<path d="M38 24C31 9 15 4 2 6c6 4 8 8 7 11 5-3 9-2 11 1 2-1 6 0 8 4 3-1 6 0 10 2z"/><path d="M9 17c5-3 9-2 11 1M20 18c2-1 6 0 8 4" fill="none"/>';
  const CROWN='<svg class="cr" viewBox="0 0 28 18"><path d="M3 16 1 5l8 5 5-8 5 8 8-5-2 11z"/><circle cx="1.5" cy="5" r="1.7"/><circle cx="14" cy="2.2" r="1.7"/><circle cx="26.5" cy="5" r="1.7"/></svg>';

    const GP=has('crown')?['left:-6%;top:43%','right:-6%;top:43%','left:43%;bottom:-6%']:['left:43%;top:-6%','left:-6%;top:43%','right:-6%;top:43%','left:43%;bottom:-6%'];
    if(has('gems'))x+=GP.map(p=>'<i class="gm" style="'+p+'"></i>').join('');

/* ---------- BẢNG XẾP HẠNG (ELO · TIỀN NẠP) + KÊNH THẾ GIỚI — realtime qua Firebase ----------
   dzy_board/<user>: hồ sơ công khai (ELO, tiền nạp, avatar, khung) · dzy_chat: tin nhắn · dzy_perm/<user>: quyền chat vàng do admin cấp */
const World=(function(){
  const b0=G.DZYNet.brokerList()[0],DB=/^fb:/.test(b0)?b0.slice(3).replace(/\/+$/,''):null;
  const lc=u=>String(u).trim().toLowerCase(),ADM='keyadmin216',F=n=>Number(n||0).toLocaleString('vi-VN');
  let board={},perm={},chat={},pin={},loaded=false,bLoaded=false,started=false,ver=0,rc=null,rv=-1,unread=0,chatOpen=false,lastSig='',lastSend=0,bt;
  const subB=new Set(),subC=new Set(),fire=(s,...a)=>s.forEach(f=>{try{f(...a);}catch(e){}});
  function put(obj,path,data,type){
    if(path==='/'){if(type==='put')return data&&typeof data==='object'?data:{};Object.assign(obj,data||{});return obj;}
    const p=path.split('/').filter(Boolean);if(p.length!==1)return obj;
    if(data==null)delete obj[p[0]];else if(type==='patch'&&typeof data==='object')obj[p[0]]=Object.assign(obj[p[0]]||{},data);else obj[p[0]]=data;return obj;}
  function stream(path,cb){if(!DB||!G.EventSource)return;const es=new EventSource(DB+'/'+path);
    ['put','patch'].forEach(ty=>es.addEventListener(ty,e=>{try{const d=JSON.parse(e.data);cb(ty,d.path,d.data);}catch(_){}}));}
  function ranks(){if(rc&&rv===ver)return rc;
    const a=Object.values(board).filter(x=>x&&x.u&&lc(x.u)!==ADM);
    const elo=a.filter(x=>x.g>0).sort((p,q)=>(q.elo||0)-(p.elo||0)||(q.g||0)-(p.g||0)||p.u.localeCompare(q.u));
    const dep=a.filter(x=>x.dep>0).sort((p,q)=>q.dep-p.dep||p.u.localeCompare(q.u));
    const em={},dm={};elo.slice(0,10).forEach((x,i)=>em[lc(x.u)]=i);dep.slice(0,10).forEach((x,i)=>dm[lc(x.u)]=i);
    rv=ver;return rc={elo,dep,em,dm};}
  function sty(name){const k=lc(name),R=ranks(),adm=k===ADM,sp=!!perm[k],e=adm?undefined:R.em[k],d=adm?undefined:R.dm[k];return{adm,sp,e,d,hl:adm||sp||e!==undefined};}
  const av=(e,size)=>{const k=lc(e.u),L=Prof.look({role:k===ADM?'admin':'user',dep:e.dep||0,pf:{av:e.av,fr:e.fr}},e.u);return '<span class="av pfh">'+Prof.html(L.av,L.fr,{size})+'</span>';};
  const tm=ts=>ts?new Date(ts).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'';
  function banner(m,s){let el=$('#wbanner');
    if(!el){el=document.createElement('div');el.id='wbanner';document.body.appendChild(el);el.onclick=()=>{el.classList.remove('on');G.DZYWFloat&&G.DZYWFloat.show('open');};}
    el.innerHTML='<b>'+(s.adm?DI('crown',14)+' ADMIN':s.sp?DI('star',14)+' VIP CHAT':DI('trophy',14)+' TOP '+(s.e+1))+'</b><span>'+esc(m.u)+': '+esc(String(m.t).slice(0,90))+'</span>';
    el.classList.add('on');Snd.play('message');clearTimeout(bt);bt=setTimeout(()=>el.classList.remove('on'),6000);}
  function incoming(k,m){if(!m||!m.u)return;const me=Auth.cur(),s=sty(m.u);fire(subC,'add',k,m);
    if(!chatOpen)unread++;if(s.hl&&me&&lc(m.u)!==lc(me.u))banner(m,s);}
  function start(){if(started||!DB)return;started=true;
    stream('dzy_board.json',(ty,p,d)=>{board=put(board,p,d,ty);bLoaded=true;ver++;fire(subB);});
    stream('dzy_perm.json',(ty,p,d)=>{perm=put(perm,p,d,ty);ver++;fire(subB);fire(subC,'perm');});
    stream('dzy_pin.json',(ty,p,d)=>{pin=put(pin,p,d,ty);fire(subC,'pin');});
    stream('dzy_chat.json?orderBy=%22$key%22&limitToLast=60',(ty,p,d)=>{
      const before=new Set(Object.keys(chat));chat=put(chat,p,d,ty);
      if(!loaded){loaded=true;fire(subC,'init');return;}
      Object.keys(chat).filter(k=>!before.has(k)).forEach(k=>incoming(k,chat[k]));
      const gone=[...before].filter(k=>!chat[k]);if(gone.length)fire(subC,'del',gone);});}
  function publish(){const me=Auth.cur();if(!me||!DB)return;const st=me.st||{},pf=me.pf||{};
    const e={u:me.u,elo:me.elo||1200,dep:me.dep||0,g:st.g||0,av:pf.av||'',fr:pf.fr||''};
    const sig=JSON.stringify(e);if(sig===lastSig)return;lastSig=sig;
    fetch(DB+'/dzy_board/'+lc(me.u)+'.json',{method:'PUT',body:JSON.stringify(Object.assign({ts:{'.sv':'timestamp'}},e))}).catch(()=>{lastSig='';});}
  async function prune(){if(Math.random()>.1)return;try{const o=await(await fetch(DB+'/dzy_chat.json?orderBy=%22$key%22&limitToFirst=40')).json()||{},lim=Date.now()-6*3600e3;
    for(const[k,v]of Object.entries(o))if(v&&v.ts<lim)fetch(DB+'/dzy_chat/'+k+'.json',{method:'DELETE'});}catch(e){}}
  async function send(text){const me=Auth.cur();if(!me)throw new Error('Chưa đăng nhập');if(!DB)throw new Error('Chưa kết nối máy chủ');
    text=String(text).replace(/\s+/g,' ').trim().slice(0,200);if(!text)return false;
    if(Date.now()-lastSend<1500)throw new Error('Gửi chậm lại một chút nhé');lastSend=Date.now();publish();
    const r=await fetch(DB+'/dzy_chat.json',{method:'POST',body:JSON.stringify({u:me.u,t:text,ts:{'.sv':'timestamp'}})});
    if(!r.ok)throw new Error('Máy chủ lỗi '+r.status);prune();return true;}
  async function setPerm(name,on){const me=Auth.cur();if(!me||me.role!=='admin')throw new Error('Chỉ admin');
    if(!/^[A-Za-z0-9_]{3,16}$/.test(name))throw new Error('Tên tài khoản không hợp lệ');
    const r=await fetch(DB+'/dzy_perm/'+lc(name)+'.json',{method:on?'PUT':'DELETE',body:on?'true':undefined});if(!r.ok)throw new Error('Máy chủ lỗi '+r.status);}
  async function setPin(m){const me=Auth.cur();if(!me||me.role!=='admin')throw new Error('Chỉ admin');
    const r=await fetch(DB+'/dzy_pin.json',{method:m?'PUT':'DELETE',body:m?JSON.stringify(m):undefined});if(!r.ok)throw new Error('Máy chủ lỗi '+r.status);}
  async function del(k){const r=await fetch(DB+'/dzy_chat/'+k+'.json',{method:'DELETE'});if(!r.ok)throw new Error('Máy chủ lỗi '+r.status);}
  setInterval(()=>{if(!Auth.cur())return;start();publish();},3000);
  return{DB,lc,ADM,F,ranks,sty,av,tm,subB,subC,perm:()=>perm,chat:()=>chat,board:()=>board,pin:()=>pin,ready:()=>bLoaded,send,setPerm,setPin,del,
    unread:()=>unread,open(v){chatOpen=v;if(v)unread=0;},start,publish};
})();

/* ---------- GHÉP NGẪU NHIÊN: đối thủ ẩn (chỉ admin thấy nhãn BOT) ---------- */
const Bots=(function(){
  const W=G.DZYWorld,lc=u=>String(u).trim().toLowerCase();
  const POOL='minh_hoang95 Thanh_Tung kimngan2k bao_chess HoangLong88 tuananh_vn Lan_Phuong9x quocviet07 DucAnh_2k3 mai_xinh_gai ngocbich_98 trung_kien tranhieu99 nhat_nam_01 Thu_Thao2k vietanh_pro HaiYen_chess phuc_loc_88 anh_khoa24 Tien_Dat_97 linh_nguyen05 CuongPham_VN khanhvy_2k2 son_tung_fan9 manh_hung86 diep_anh_k9 hoai_nam_13 PhucAnh_Chess bao_tran_2k4 ThanhDat_78 yen_nhi_01 gia_bao_2k5 xuan_mai_92 DinhKhoa_99 quynh_anh_03 tuan_kiet_vn Hieu_Minh_08 ngan_ha_chess hung_cuong_85 thao_vy_2k1'.split(' '),SET=new Set(POOL.map(lc));
  const hs=x=>{let h=7;for(const c of x)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;return h;};
  const seedOf=n=>{const h=hs(lc(n));return{u:n,elo:900+h%700,g:12+(h>>>5)%150};};
  const st=n=>{const e=W.board()[lc(n)];return e&&e.u?{u:e.u,elo:e.elo||1200,g:e.g||0}:seedOf(n);};
  const put=e=>{if(!W.DB)return;fetch(W.DB+'/dzy_board/'+lc(e.u)+'.json',{method:'PUT',keepalive:true,body:JSON.stringify({u:e.u,elo:e.elo,dep:0,g:e.g,av:'',fr:'',ts:{'.sv':'timestamp'}})}).catch(()=>{});};
  let seeded=false;
  setInterval(()=>{if(seeded||!Auth.cur()||!W.ready())return;seeded=true;const b=W.board();POOL.forEach(n=>{if(!b[lc(n)])put(seedOf(n));});},4000);
  function pick(my){const target=Math.max(100,my+(Math.random()<.5?-1:1)*(50+Math.random()*150)),last=store.get('lastbot','');
    const a=POOL.filter(n=>n!==last).map(st).sort((p,q)=>Math.abs(p.elo-target)-Math.abs(q.elo-target)).slice(0,4);return a[Math.random()*a.length|0];}
  function settle(g,S){const b=g.bot,e=st(b.u),ex=1/(1+Math.pow(10,(b.myElo-e.elo)/400));
    put({u:e.u,g:e.g+1,elo:Math.max(100,Math.round(e.elo+24*((1-S)-ex)))});}
  const cfg=e=>({depth:e<850?1:e<1100?2:e<1400?3:e<1700?4:5,time:e<1100?120:e<1500?350:e<1800?900:1600,blunder:e<800?.3:e<1000?.16:e<1200?.08:e<1450?.03:0,book:e>=1300,delay:()=>600+Math.random()*2600});
  addEventListener('pagehide',()=>{const g=App.game;if(g&&g.bot&&!g.result&&!g._pf&&g.moves.length>(g.human==='w'?0:1)){
    try{Prof.count(Object.assign({},g,{result:{score:g.human==='w'?'0-1':'1-0',reason:'resign'}}));g._pf=1;}catch(e){}}});
  return G.DZYBots={is:n=>SET.has(lc(n)),pick,settle,cfg};
})();

App.screens.match=sec=>{
  const Pr=G.DZYProf,B=G.DZYBots,me=Auth.cur(),vn=cfg.lang==='vi',tx=(a,b)=>vn?a:b,adm=me.role==='admin';

  const mmApi=(p,m,b)=>fetch(MM+'/'+p+'.json',{method:m||'GET',body:b==null?undefined:JSON.stringify(b),keepalive:true}).then(r=>{if(!r.ok)throw new Error('mm '+r.status);return r.json();});
