  App.cleanup=()=>{alive=false;tm.forEach(x=>{clearTimeout(x);clearInterval(x);});tm.length=0;dropTicket();leaveRoom();};
  addEventListener('pagehide',dropTicket);
  const later=(f,ms)=>tm.push(setTimeout(()=>alive&&f(),ms));
  const face=(n,z)=>{const L=Pr.look(Pr.rec(n),n);return '<span class="av pfh">'+Pr.html(L.av,L.fr,{size:z})+'</span>';};
  const rk=e=>Pr.rank(e),myE=()=>(Auth.cur().elo||1200);
  const orb=[0,1,2,3].map(i=>`<span class="zmob" style="--i:${i}"><img alt="" src="${A.piece('classic',['wn','bb','wr','bq'][i])}"></span>`).join('');
  sec.innerHTML=App.head(tx('Ghép ngẫu nhiên','Random match'))+`<div class="scroll"><div class="zmmt"><div id="zmstage"><div class="zmradar" id="rd"><i class="zmrr" style="--k:6"></i><i class="zmrr" style="--k:20"></i><i class="zmrr" style="--k:34"></i><i class="zmwv"></i><i class="zmwv"></i><i class="zmwv"></i><i class="zmsw"></i>${orb}<div class="zmrc">${face(me.u,64)}</div></div></div><p class="zmmst" id="mst"></p><p class="zmmsub" id="msub"></p><div class="zmmct" id="mct"></div></div></div>`;
  function idle(){
    $('#mst',sec).textContent=tx('Sẵn sàng tìm đối thủ','Ready to find a match');
    $('#msub',sec).innerHTML=tx('ELO của bạn','Your Elo')+': <b>'+myE()+'</b> · '+rk(myE())[1];
    $('#mct',sec).innerHTML=`<div class="zmmchips" id="mch">${['3+2','5+0','10+0'].map(v=>`<button data-v="${v}" class="${v===tc?'on':''}">${v}</button>`).join('')}</div><button class="btn gold wide" id="mgo">${tx('Tìm đối thủ','Find opponent')}</button><p class="hint">${tx('Chỉ ván Ghép ngẫu nhiên mới được tính ELO.','Only random matches count for Elo.')}</p>`;
    $('#mch',sec).onclick=e=>{const b=e.target.closest('button');if(!b)return;tc=b.dataset.v;$$('#mch button',sec).forEach(x=>x.classList.toggle('on',x===b));};
    $('#mgo',sec).onclick=search;
  }
  function search(){
    if(busy)return;busy=true;store.set('mtc',tc);Snd.play('open');
    const rd=$('#rd',sec);rd.classList.add('zmrun');
    $('#mct',sec).innerHTML=`<button class="btn wide ghost" id="mx">${tx('Huỷ','Cancel')}</button>`;
    $('#msub',sec).textContent=tc;
    const msgs=vn?['Đang quét người chơi trực tuyến…','Đang so khớp ELO…','Đang chọn đối thủ phù hợp…','Sắp xong rồi…']:['Scanning online players…','Matching Elo…','Picking an opponent…','Almost there…'];let k=0;
    const say=()=>{$('#mst',sec).textContent=msgs[Math.min(k++,msgs.length-1)];};say();
    tm.push(setInterval(say,1500));
    tm.push(setInterval(()=>{const a=Math.random()*6.283,r=14+Math.random()*30,d=document.createElement('i');d.className='zmbl';d.style.left=(50+Math.cos(a)*r)+'%';d.style.top=(50+Math.sin(a)*r)+'%';rd.appendChild(d);setTimeout(()=>d.remove(),1800);},520));
    $('#mx',sec).onclick=()=>{Snd.play('close');go('match');};
    t0=Date.now();
    if(!MM||!App.Online||!App.Online.create){later(found,BOT_WAIT);return;}   // không có máy chủ realtime: chỉ còn bot
    queue();
    later(()=>{if(!matched&&!hosting&&!joining)found();},BOT_WAIT);           // hết thời gian chờ mà không có người thật → bot
  }
  async function queue(){
    mine=qpath();
    try{
      await mmApi(mine+'/'+mkey,'PUT',{u:me.u,elo:myE(),ts:{'.sv':'timestamp'}});
      const r=await mmApi(mine+'/'+mkey);if(r&&r.ts)off=r.ts-Date.now();
    }catch(e){mine=null;return;}                                                // lỗi mạng → bot dự phòng sau BOT_WAIT
    tm.push(setInterval(()=>{if(!matched&&mine)mmApi(mine+'/'+mkey,'PATCH',{ts:{'.sv':'timestamp'}}).catch(()=>{});},3000));
    tm.push(setInterval(tick,1500));tick();
  }
  async function tick(){
    if(!alive||matched||!mine||poll)return;poll=1;
    try{
      const o=await mmApi(qpath())||{},now=Date.now()+off,el=Date.now()-t0;
      const fresh=([k,v])=>k!==mkey&&v&&typeof v==='object'&&v.u&&now-v.ts<TTL;
      const all=Object.entries(o).filter(fresh);
      if(!alive||matched||!mine)return;
      // 1) có người đã chọn mình và mở phòng → vào phòng
      if(!hosting&&!joining){
        const h=all.find(([k,v])=>v.pair===mkey&&v.room);
        if(h){joining=true;mmApi(mine+'/'+mkey,'PATCH',{taken:1}).catch(()=>{});

          later(()=>{if(joining&&!matched){const s=App.Online.state();if(!(s&&s.g)){try{App.Online.leave();}catch(e){}joining=false;G.DZYMM=null;mmApi(mine+'/'+mkey,'PATCH',{taken:null}).catch(()=>{});}}},12000);
          return;}
      }
      // 2) mình có khoá nhỏ hơn → mình làm chủ phòng với người phù hợp nhất
      if(!hosting&&!joining){

          .sort((a,b)=>Math.abs((a[1].elo||1200)-my)-Math.abs((b[1].elo||1200)-my))[0];

          if(!code){hosting=false;mmApi(mine+'/'+mkey,'PATCH',{pair:null}).catch(()=>{});return;}
          G.DZYMM={code,u:c[1].u,elo:c[1].elo||1200};hit(c[1]);
          await mmApi(mine+'/'+mkey,'PATCH',{room:code});
          // đối thủ không vào sau 12s → huỷ phòng, tìm tiếp
          later(()=>{if(hosting&&!matched){const s=App.Online.state();if(!(s&&s.g)){try{App.Online.leave();}catch(e){}hosting=false;G.DZYMM=null;mmApi(mine+'/'+mkey,'PATCH',{pair:null,room:null}).catch(()=>{});}}},12000);
        }
      }
    }catch(e){}finally{poll=0;}
  }
  function hit(b){   // đã có người thật: dừng radar, hiện trạng thái kết nối
    Pr.seed({u:b.u,elo:b.elo||1200,g:b.g||0,dep:0,av:'',fr:''});Snd.play('join');
    $('#mst',sec).textContent=tx('Đã tìm thấy đối thủ!','Opponent found!');
    $('#msub',sec).textContent=tx('Đang kết nối…','Connecting…');
  }
  function found(){

    const my=myE(),b=B.pick(my),color=Math.random()<.5?'w':'b';

const WFloat=(function(){
  const W=World,MT=40;
  let el=null,fab=null,P=null,key='',st='closed',flt='all',reply=null,unseen=0,mentions=0,adm=false,my='',snd=store.get('wsnd',true)!==false;
  const blk=new Set(store.get('wblock',[]));

  function drag(h,node,can,tap,end){let d=null;

      const r=node.getBoundingClientRect();d={x:e.clientX,y:e.clientY,l:r.left,t:r.top,m:false,id:e.pointerId};try{h.setPointerCapture(e.pointerId);}catch(_){}});
    h.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;

  function fabPos(){if(!fab)return;const s=store.get('wfl',{});

  function ensure(){const u=Auth.cur(),k=u?W.lc(u.u)+'|'+u.role:'';if(k===key&&(el||!u))return;destroy();key=k;if(u)build(u);}
  /* ----- dựng giao diện ----- */

  function paintPin(){if(!P)return;const p=W.pin(),b=q('#wpin');if(!p||!p.t){b.hidden=true;return;}b.hidden=false;
    b.innerHTML=`${DI('pin',15)}<span><b>${esc(p.u||'')}:</b> ${fmt(p.t)}</span>${adm?`<button type="button" id="wunpin" aria-label="Bỏ ghim">${DI('close',14)}</button>`:''}`;}
  function setReply(u){reply=u;const r=q('#wrep');r.hidden=!u;if(u){r.innerHTML=`${DI('reply',14)}<span>Trả lời <b>@${esc(u)}</b></span><button type="button" aria-label="Huỷ trả lời">${DI('close',14)}</button>`;r.querySelector('button').onclick=()=>setReply(null);q('#wi').focus();}}
  function onChat(ev,k,m){

    if(ev==='add'&&m&&m.u){const mine=W.lc(m.u)===my,men=atMe(m.t)&&!mine;if(men)mentions++;setTimeout(badge,0);

    if(st==='closed')return;
    if(ev==='init'||ev==='perm')paintAll();
    else if(ev==='pin')paintPin();
    else if(ev==='del'){const wl=q('#wl');k.forEach(x=>{const e=wl.querySelector('[data-k="'+x+'"]');e&&e.remove();});}
  }
  W.subC.add(onChat);
  const B=(a,ic,tx,cls)=>`<button class="wact ${cls||''}" data-ac="${a}">${DI(ic,18)}<span>${tx}</span></button>`;
  function build(u){

    el=document.createElement('div');el.id='wfl';
    el.innerHTML=`<button id="wfab" aria-label="Mở kênh thế giới">${DI('globe',24)}<b class="wfb" hidden></b></button>
     <section id="wpanel" hidden role="dialog" aria-label="Kênh thế giới">

       <button class="wib s${snd?' on':''}" id="wsnd" aria-label="Âm báo">${DI(snd?'bell':'bellOff',15)}</button><button class="wib s" id="winfo" aria-label="Thông tin">${DI('info',15)}</button>${adm?`<button class="wib s gold" id="wperm" aria-label="Quyền chat">${DI('gear',15)}</button>`:''}<button class="wib s" id="wmax" aria-label="Phóng to">${DI('expand',15)}</button><button class="wib s" id="wmin" aria-label="Thu nhỏ thành bong bóng">${DI('minus',15)}</button></header>
      <div class="wtabs" id="wtabs"><button data-f="all" class="on">Tất cả</button><button data-f="vip">${DI('star',12)}VIP·Top</button><button data-f="me">${DI('at',12)}Nhắc tôi<b id="wmn" hidden></b></button><button data-f="mine">Của tôi</button></div>
      <div class="wpin" id="wpin" hidden></div>
      <div class="wlw"><div class="wlist" id="wl"></div><button class="wjump" id="wjump" hidden></button></div>
      <div class="wrep" id="wrep" hidden></div>

      <form id="wf" autocomplete="off"><button type="button" class="wsm" id="wsm" aria-label="Sticker">${DI('smile',20)}</button>
       <div class="wfi"><textarea id="wi" rows="1" maxlength="200" enterkeyhint="send" placeholder="Nói với cả thế giới…"></textarea><small class="wcnt" id="wcnt"></small></div>
       <button class="wsend" id="wsendb" aria-label="Gửi">${DI('send',20)}</button></form>
     </section>`;
    document.body.appendChild(el);fab=el.querySelector('#wfab');P=el.querySelector('#wpanel');fabPos();size();W.start();

        else App.closeModal();});});
    P.addEventListener('click',async e=>{

        const s=App.modal(`<h3>Quyền chat đặc biệt</h3><p class="hint">Người được cấp sẽ có chữ vàng nổi bật và thông báo tới mọi người chơi.</p><div class="au-f"><input id="pu" placeholder="Tên tài khoản" maxlength="16" autocapitalize="off"></div><div class="row3" style="grid-template-columns:1fr 1fr"><button class="btn gold" id="pg">Cấp quyền</button><button class="btn ghost" id="pr">Thu hồi</button></div><div id="pl" class="wpl"></div><button class="btn wide ghost" data-x>Đóng</button>`,{onClose:()=>W.subC.delete(pl)});
        const list=()=>{const p=W.perm(),ks=Object.keys(p).filter(k=>p[k]);s.querySelector('#pl').innerHTML=ks.length?ks.map(k=>`<span>${esc(k)}<button data-rm="${k}" aria-label="Thu hồi">${DI('close',12)}</button></span>`).join(''):'<small class="hint">Chưa cấp cho ai.</small>';};
        const pl=ev=>{if(ev==='perm')list();};W.subC.add(pl);list();
        const run=async on=>{const n=s.querySelector('#pu').value.trim();try{await W.setPerm(n,on);toast((on?'Đã cấp quyền cho ':'Đã thu hồi của ')+n,'ok');s.querySelector('#pu').value='';}catch(x){toast(x.message,'bad');}};
        s.querySelector('#pg').onclick=()=>run(true);s.querySelector('#pr').onclick=()=>run(false);s.querySelector('[data-x]').onclick=()=>App.closeModal();
        s.addEventListener('click',e2=>{const r=e2.target.closest('[data-rm]');if(r)W.setPerm(r.dataset.rm,false).catch(x=>toast(x.message,'bad'));});

  addEventListener('resize',()=>{if(!el)return;fabPos();if(!P.hidden)size();});
  return{show,toggle:()=>show(st==='closed'?'open':'closed'),state:()=>st};
})();
G.DZYWFloat=WFloat;

<script>/* Chế độ Online. Chủ phòng là trọng tài: kiểm tra mọi nước đi và phát lại TOÀN BỘ trạng thái,
   nên hai máy luôn tự khớp lại kể cả khi rớt gói tin hoặc mất mạng tạm thời. */
(function(G){
'use strict';
const App=G.DZYApp,E=G.DZYEngine,Net=G.DZYNet,Snd=G.DZYAudio,t=(...a)=>App.t(...a);
const {$,esc,toast,go}=App;
const CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const rand=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>CHARS[x%CHARS.length]).join('');};
const LOST=6000,GONE=45000;
const LDB=(b=>/^fb:/.test(b)?b.slice(3).replace(/\/+$/,''):null)(Net.brokerList()[0]);   // danh sách ván đang diễn ra cho chức năng Theo dõi
const liveReq=(code,m,b)=>{if(LDB)fetch(LDB+'/dzy_live/'+code+'.json',{method:m,body:b,keepalive:true}).catch(()=>{});};
function livePut(){const g=S&&S.g;if(!g||g.result||!g.names)return;
  liveReq(S.code,'PUT',JSON.stringify({w:g.names.w,b:g.names.b,tc:S.tc.base?S.tc.base/60000+'+'+S.tc.inc/1000:'∞',n:g.moves.length,ts:{'.sv':'timestamp'}}));}
let S=null; // phiên hiện tại
const sess={get(){try{return JSON.parse(sessionStorage.getItem('dzy.room'));}catch(e){return null;}},set(v){try{v?sessionStorage.setItem('dzy.room',JSON.stringify(v)):sessionStorage.removeItem('dzy.room');}catch(e){}}};
let myId=(sess.get()||{}).id||rand(12);
const myName=()=>App.cfg.name||'DZY-'+myId.slice(0,4);
const topic=(code,d)=>'dzychess/v1/'+code+'/'+d;
const clean=(s,n)=>String(s==null?'':s).slice(0,n);
const normCode=s=>{const m=/(?:join=|DZYCHESS:)?\b([0-9][A-Z2-9]{5})\b/i.exec(String(s).trim().replace(/^.*(?=join=|DZYCHESS:)/i,''));return m?m[1].toUpperCase():null;};

async function connect(index,code,sub,onMsg){
  const url=Net.brokerList()[index];if(!url)throw new Error('broker');
  const c=new (/^fb:/.test(url)?Net.Fb:Net.Mqtt)(url,{
    onMessage:(tp,text)=>{if(!S||S.net!==c||text.length>20000)return;let m;try{m=JSON.parse(text);}catch(e){return;}if(m&&typeof m.t==='string')onMsg(m);},
    onState:st=>{if(!S||S.net!==c)return;const g=S.g;
      if(st==='offline'){g&&g.api&&g.api.banner(t('net_lost'));}
      else{S.lastSeen=Date.now();g&&g.api&&g.api.banner('');if(S.role!=='host')pub({t:'sync'});else broadcast();}}
  });
  await c.connect(7000);
  c.subscribe(topic(code,sub));
  return c;
}
function pub(m){if(!S||!S.net)return false;m.id=myId;return S.net.publish(topic(S.code,S.role==='host'?'g':'h'),JSON.stringify(m));}
function close(){if(!S)return;clearInterval(S.beat);clearInterval(S.retry);S.net&&S.net.close();S=null;}
function leave(){
  if(!S)return;
  if(S.role==='host'&&S.live)liveReq(S.code,'DELETE');
  if(S.role==='host')pub({t:'closed'});else if(S.role==='guest')pub({t:'leave'});
  const n=S.net;clearInterval(S.beat);clearInterval(S.retry);S=null;sess.set(null);setTimeout(()=>n&&n.close(),150);
}

/* ---------- Chủ phòng ---------- */
async function create(tc,status){
  close();
  const count=Net.brokerList().length;status&&status(t('connecting'));
  // thử lần lượt từng máy chủ; số thứ tự máy chủ là ký tự đầu của ID phòng
  for(let i=0;i<count;i++){
    const code=String(i)+rand(5);
    const me=S={role:'host',code,net:null,tc,guest:null,seen:new Set(),game:1,hostColor:Math.random()<.5?'w':'b',lastSeen:0};
    try{
      const net=await connect(i,code,'h',hostMsg);
      if(S!==me){net.close();return null;}
      me.net=net;me.beat=setInterval(hostBeat,2000);sess.set({id:myId,role:'host',code});
      return code;
    }catch(e){if(S!==me)return null;}
  }
  S=null;throw new Error(t('net_fail'));
}
function stateMsg(){
  const g=S.g,names={};names[S.hostColor]=myName();names[S.hostColor==='w'?'b':'w']=S.guest.name;
  return{t:'state',s:{game:S.game,moves:g?g.moves:[],names,hostColor:S.hostColor,tc:S.tc,left:g?g.left:null,used:g?g.used:null,running:g?g.running:false,result:g?g.result:null}};
}
function broadcast(){if(S&&S.role==='host'&&S.guest)pub(stateMsg());}
function hostBeat(){
  if(!S||!S.guest)return;
  broadcast();
  const g=S.g;if(!g||!S.net.online)return;
  if(g.result){if(S.live){S.live=0;liveReq(S.code,'DELETE');}}else{S.lv=(S.lv||0)+1;if(S.lv%3===1){S.live=1;livePut();}}
  const quiet=Date.now()-S.lastSeen;
  if(!g.result){
    g.api.banner(quiet>LOST?t('opp_lost'):'');
    if(quiet>GONE){g.api.banner('');g.api.finish({score:S.hostColor==='w'?'1-0':'0-1',reason:'disconnect'});broadcast();}
  }
}
function hostStart(){
  const g=App.newGame({mode:'online',tc:S.tc,color:S.hostColor});
  g.isHost=true;g.room=S.code;g.human=S.hostColor;g.flipped=g.human==='b';
  g.names={};g.names[g.human]=myName();g.names[g.human==='w'?'b':'w']=S.guest.name;
  if(G.DZYMM&&G.DZYMM.code===S.code)g.mm=G.DZYMM;
  S.g=g;go('game',g);
}
function hostMsg(m){
  const from=clean(m.id,20);if(!from)return;
  const isGuest=S.guest&&S.guest.id===from;
  if(isGuest){S.lastSeen=Date.now();}
  if(m.t==='probe'){pub({t:'info',to:from,open:!S.guest});return;}
  if(m.t==='join'){
    if(S.guest&&!isGuest){pub({t:'deny',to:from});return;}
    if(!S.guest){S.guest={id:from,name:clean(m.name,16)||'Guest'};if(S.guest.name===myName())S.guest.name+=' (2)';S.lastSeen=Date.now();
      Snd.play('join');toast(t('connected'),'ok');hostStart();}
    pub({t:'accept',to:from});broadcast();return;
  }
  if(m.t==='watch'){pub({t:'watch-ok',to:from,started:!!S.guest});broadcast();return;}
  if(m.t==='sync'){broadcast();return;}
  if(!isGuest||!S.g)return;
  const g=S.g,guestColor=S.hostColor==='w'?'b':'w';
  if(m.t==='move'){
    if(m.game===S.game&&!g.result&&m.ply===g.moves.length&&(g.pos.turn===1?'w':'b')===guestColor&&typeof m.uci==='string')g.api.play(m.uci);
    broadcast();
  }else if(m.t==='chat'){relayChat(S.guest.name,clean(m.text,200),clean(m.mid,20),from);}
  else if(m.t==='resign'&&!g.result){g.api.finish({score:guestColor==='w'?'0-1':'1-0',reason:'resign'});broadcast();}
  else if(m.t==='draw-offer'&&!g.result){
    if(S.offered){agreeDraw();return;}
    App.confirmBox(t('q_draw',S.guest.name,myName()),t('accept'),agreeDraw,()=>pub({t:'draw-decline'}),t('decline'));
  }else if(m.t==='draw-accept'&&S.offered)agreeDraw();
  else if(m.t==='draw-decline'){S.offered=false;toast(t('draw_declined'));}
  else if(m.t==='rematch'&&g.result){newRound();}
  else if(m.t==='leave'){
    toast(t('r_left'),'err');g.api.banner(t('r_left'));
    if(!g.result){g.api.finish({score:S.hostColor==='w'?'1-0':'0-1',reason:g.moves.length?'resign':'left'});broadcast();}
    S.guest.gone=true;S.lastSeen=Date.now();
  }
}
function agreeDraw(){if(!S||!S.g||S.g.result)return;S.offered=false;S.g.api.finish({score:'1/2-1/2',reason:'agree'});broadcast();}
function newRound(){
  S.game++;S.offered=false;S.hostColor=S.hostColor==='w'?'b':'w';
  App.closeModal(true);hostStart();broadcast();
}
function relayChat(name,text,mid,from){
  if(!text||S.seen.has(mid))return;S.seen.add(mid);
  const msg={t:'chat',name,text,mid,from,ts:Date.now()};
  pub(Object.assign({},msg));S.g&&S.g.api.chat(msg,from===myId);
}

/* ---------- Khách và khán giả ---------- */
async function join(code,watch,status){
  close();
  const idx=Number(code[0]);
  S={role:watch?'watch':'guest',code,net:null,seen:new Set(),g:null,lastSeen:Date.now(),game:0};
  const me=S;status&&status(t('connecting'));
  let net;
  try{net=await connect(idx,code,'g',guestMsg);}catch(e){if(S===me)S=null;throw new Error(t('net_fail'));}
  if(S!==me){net.close();return;}
  S.net=net;status&&status(t('joining'));
  let tries=0;
  const hello=()=>pub({t:watch?'watch':'join',name:myName()});
  hello();
  S.retry=setInterval(()=>{
    if(S!==me)return;
    if(S.accepted){clearInterval(S.retry);return;}
    if(++tries>=6){status&&status(t('room_none'),'err');toast(t('room_none'),'err');sess.set(null);close();return;}
    hello();
  },1500);
  S.status=status;
  S.beat=setInterval(guestBeat,2000);
}
function guestBeat(){
  if(!S||!S.g)return;
  pub({t:S.role==='guest'?'ping':'sync'});
  if(S.pending&&Date.now()-S.pending.at>1500&&S.net.online)pub(S.pending.msg);
  const g=S.g;if(!S.net.online||g.result)return;
  const quiet=Date.now()-S.lastSeen;
  g.api.banner(quiet>LOST?t('opp_lost'):'');
  if(quiet>GONE){g.api.banner('');g.api.finish(S.role==='guest'?{score:g.human==='w'?'1-0':'0-1',reason:'disconnect'}:{score:'1/2-1/2',reason:'disconnect'});}
}
function guestMsg(m){
  if(m.to&&m.to!==myId)return;
  S.lastSeen=Date.now();
  if(m.t==='deny'){clearInterval(S.retry);S.status&&S.status(t('room_full'),'err');toast(t('room_full'),'err');sess.set(null);close();return;}
  if(m.t==='accept'||m.t==='watch-ok'){S.accepted=true;if(S.role==='guest')sess.set({id:myId,role:'guest',code:S.code});if(m.t==='watch-ok'&&!m.started)S.status&&S.status(t('waiting'));return;}
  if(m.t==='state'){if(S.accepted)applyState(m.s);return;}
  if(m.t==='closed'){
    const g=S.g;toast(t('closed'),'err');sess.set(null);
    if(g){g.api.banner(t('closed'));if(!g.result&&S.role==='guest')g.api.finish({score:g.human==='w'?'1-0':'0-1',reason:'left'});close();}else{close();go('online');}
    return;
  }
  const g=S.g;if(!g)return;
  if(m.t==='chat'){const mid=clean(m.mid,20);if(S.seen.has(mid))return;S.seen.add(mid);g.api.chat({name:clean(m.name,16),text:clean(m.text,200),ts:Number(m.ts)||Date.now()},m.from===myId);}
  else if(S.role==='guest'&&m.t==='draw-offer'&&!g.result)App.confirmBox(t('q_draw',t('opponent'),myName()),t('accept'),()=>pub({t:'draw-accept'}),()=>pub({t:'draw-decline'}),t('decline'));
  else if(m.t==='draw-decline'&&S.role==='guest')toast(t('draw_declined'));
}
function applyState(s){
  if(!s||!Array.isArray(s.moves)||s.moves.length>1200||!s.names||!s.tc)return;
  const moves=s.moves.map(x=>clean(x,5));
  let g=S.g;
  if(!g||s.game!==S.game){
    const color=S.role==='guest'?(s.hostColor==='w'?'b':'w'):'w';
    g=App.newGame({mode:S.role==='guest'?'online':'watch',tc:{base:Number(s.tc.base)||0,inc:Number(s.tc.inc)||0},color});
    g.room=S.code;g.human=color;g.flipped=color==='b';g.names={w:clean(s.names.w,20),b:clean(s.names.b,20)};
    App.loadMoves(g,moves);
    if(S.role==='guest'&&G.DZYMM&&G.DZYMM.code===S.code)g.mm=G.DZYMM;
    S.game=s.game;S.g=g;S.pending=null;
    if(S.role==='guest')Snd.play('join');
    toast(t('connected'),'ok');go('game',g);
  }
  const mine=g.moves.join(' '),theirs=moves.join(' ');
  if(mine!==theirs){
    if(S.pending&&moves.length===S.pending.msg.ply&&g.moves.length===moves.length+1){
      // nước của mình chưa tới chủ phòng: giữ nguyên, sẽ gửi lại
      return;
    }
    if(moves.length===g.moves.length+1&&theirs.startsWith(mine)){if(!g.api.play(moves[moves.length-1]))g.api.rebuild(moves);}
    else g.api.rebuild(moves);
  }
  if(S.pending&&moves.length>S.pending.msg.ply)S.pending=null;
  if(s.left&&s.used&&!S.pending){for(const c of['w','b']){g.left[c]=Number(s.left[c])||0;g.used[c]=Number(s.used[c])||0;}g.running=!!s.running;g.last=Date.now();}
  if(s.result&&!g.result&&/^(1-0|0-1|1\/2-1\/2)$/.test(s.result.score))g.api.finish({score:s.result.score,reason:clean(s.result.reason,12)});
  g.api.ui();
}

/* ---------- giao tiếp với màn hình trận đấu ---------- */
const Online={
  localMove(uci){
    if(!S)return;
    if(S.role==='host'){broadcast();return;}
    const msg={t:'move',game:S.game,ply:S.g.moves.length-1,uci};
    S.pending={msg,at:Date.now()};pub(msg);
  },
  chat(text){
    if(!S||!S.net.online||!S.g)return false;
    const mid=rand(10);
    if(S.role==='host'){relayChat(myName(),text,mid,myId);return true;}
    return pub({t:'chat',text,mid});
  },
  resign(){
    if(!S||!S.g)return;
    if(S.role==='host'){S.g.api.finish({score:S.hostColor==='w'?'0-1':'1-0',reason:'resign'});broadcast();}
    else if(!pub({t:'resign'}))toast(t('net_lost'),'err');
  },
  offerDraw(){
    if(!S||!S.g||S.g.result)return;
    if(S.role==='host'){S.offered=true;if(pub({t:'draw-offer'}))toast(t('draw_sent'));}
    else if(pub({t:'draw-offer'}))toast(t('draw_sent'));
  },
  rematch(){
    if(!S){go('online');return;}
    if(S.role==='host'){if(S.guest&&!S.guest.gone)newRound();else{leave();go('online');}}
    else{pub({t:'rematch'});toast(t('waiting'));}
  },
  leave,broadcast,create,join,
  saved(){const s=sess.get();return !S&&s&&s.role==='guest'?s:null;},
  rejoin(){const s=sess.get();if(!s)return;go('online',{code:s.code,auto:true});},
  state:()=>S
};
App.Online=Online;
addEventListener('pagehide',()=>{if(S&&S.role==='host'&&S.guest){pub({t:'closed'});if(S.live)liveReq(S.code,'DELETE');}});
addEventListener('beforeunload',e=>{if(S&&S.g&&!S.g.result&&S.role!=='watch'){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.net){S.lastSeen=Date.now();S.net.wake();}});

/* ---------- Sảnh online ---------- */
const inviteText=code=>/^https?:$/.test(location.protocol)?location.origin+location.pathname+'#join='+code:'DZYCHESS:'+code;
App.screens.online=(sec,arg)=>{
  arg=arg||{};
  const watch=!!arg.watch;
  sec.innerHTML=App.head(watch?'Spectator':t('m_on'))+`<div class="scroll"><div id="lobby">
  ${watch?`<p class="note">${t('watch_s')}</p>`:`<div class="panel"><input id="myname" maxlength="16" placeholder="${t('yourname')}" value="${esc(App.cfg.name)}">
   <label>${t('time')}</label>${App.seg('tc',['0','3+2','5+0','10+0','15+10','30+0'].map(v=>[v,v==='0'?t('notime'):v]),arg.tc||'10+0')}
   <button class="btn wide" id="create">${t('create')}</button></div>`}
  <div class="panel"><input id="code" class="code" maxlength="80" placeholder="${t('roomid')}" autocapitalize="characters" autocomplete="off" value="${esc(arg.code||'')}">
   <div class="row"><button class="btn ghost" id="check">${t('checkroom')}</button><button class="btn" id="join">${t(watch?'watch':'join')}</button></div>
   <div class="row"><button class="btn ghost" id="scan">${t('scan')}</button><label class="btn ghost">${t('scanphoto')}<input type="file" accept="image/*" id="photo" hidden></label></div></div>
  <p class="status-line" id="netmsg" aria-live="polite"></p><p class="note">${t('pubnote')}</p></div><div id="room" hidden></div></div>`;
  let tc=arg.tc||'10+0',stream=null;
  App.bindSeg(sec,(k,v)=>tc=v);
  const status=(msg,type)=>{const n=$('#netmsg',sec)||$('#waitmsg',sec);if(!n)return;n.textContent=msg;n.className='status-line '+(type||'busy');
    if(type==='err'){for(const id of['#join','#create','#check']){const b=$(id,sec);if(b)b.disabled=false;}}};
  const saveName=()=>{const n=$('#myname',sec);if(n){App.cfg.name=n.value.trim().slice(0,16);App.store.set('settings',App.cfg);}};
  const getCode=()=>{const c=normCode($('#code',sec).value);if(!c)status(t('badid'),'err');return c;};
  async function doJoin(){
    const c=getCode();if(!c)return;saveName();$('#join',sec).disabled=true;
    try{await join(c,watch,status);}catch(e){status(e.message,'err');}
  }
  async function doCreate(){
    saveName();const b=$('#create',sec);b.disabled=true;
    const m=/^(\d+)\+(\d+)$/.exec(tc),time=m?{base:m[1]*60000,inc:m[2]*1000}:{base:0,inc:0};
    try{
      const code=await create(time,status);if(!code||App.screen!=='online')return;
      Snd.play('create');
      $('#lobby',sec).hidden=true;
      const room=$('#room',sec);room.hidden=false;
      const text=inviteText(code);
      room.innerHTML=`<div class="panel room"><small>${t('roomid')}</small><div class="rid" id="rid">${code}</div><div class="qr">${Net.qrSvg(text)}</div>
      <div class="row"><button class="btn ghost" id="copy">${t('copy')}</button><button class="btn" id="share">${t('share')}</button></div>
      <div class="waiting"><i></i><i></i><i></i></div><p class="status-line busy" id="waitmsg">${t('waiting')}</p>
      <button class="btn wide ghost" id="cancel">${t('cancelroom')}</button></div><p class="note">${t('pubnote')}</p>`;
      $('#lobby',sec).remove();
      $('#copy',room).onclick=()=>App.copyText(code);
      $('#share',room).onclick=async()=>{
        const invite='DZY CHESS — '+t('roomid')+': '+code+(text.startsWith('http')?'\n'+text:'');
        if(navigator.share){try{await navigator.share({title:'DZY CHESS',text:invite});return;}catch(e){if(e.name==='AbortError')return;}}
        App.copyText(invite);
      };
      $('#cancel',room).onclick=()=>{leave();go('online');};
    }catch(e){status(e.message,'err');b.disabled=false;}
  }
  async function check(){
    const c=getCode();if(!c)return;close();const b=$('#check',sec);b.disabled=true;status(t('joining'));
    let answered=false,done=false;
    const me=S={role:'probe',code:c,net:null};
    const end=(msg,type)=>{if(done||S!==me)return;done=true;close();b.disabled=false;status(msg,type);};
    try{
      const net=await connect(Number(c[0]),c,'g',m=>{if(m.t==='info'&&m.to===myId){answered=true;end(t(m.open?'room_ok':'room_full'),m.open?'ok':'err');}});
      if(S!==me){net.close();return;}S.net=net;S.role='guest';pub({t:'probe'});setTimeout(()=>pub({t:'probe'}),1500);
      setTimeout(()=>{if(!answered)end(t('room_none'),'err');},4000);
    }catch(e){end(t('net_fail'),'err');}
  }
  /* quét QR: dùng BarcodeDetector sẵn có; trình duyệt không hỗ trợ thì nạp thư viện jsQR khi có mạng */
  async function decoder(){
    if(G.BarcodeDetector){try{const d=new BarcodeDetector({formats:['qr_code']});return async src=>{const r=await d.detect(src);return r[0]&&r[0].rawValue;};}catch(e){}}
    if(!G.jsQR)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=res;s.onerror=()=>rej(new Error(t('noqr')));document.head.appendChild(s);});
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    return async src=>{const w=src.videoWidth||src.width,h=src.videoHeight||src.height;if(!w)return null;const k=Math.min(1,900/Math.max(w,h));cv.width=w*k;cv.height=h*k;cx.drawImage(src,0,0,cv.width,cv.height);const r=G.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);return r&&r.data;};
  }
  const stopCam=()=>{if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}};
  const found=v=>{const c=v&&normCode(v);if(!c)return false;stopCam();App.closeModal(true);$('#code',sec).value=c;doJoin();return true;};
  async function scan(){
    let read;
    try{if(!navigator.mediaDevices)throw new Error();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){status(t('nocam'),'err');return;}
    try{read=await decoder();}catch(e){stopCam();status(e.message,'err');return;}
    const s=App.modal(`<h3>${t('scan')}</h3><video playsinline muted autoplay></video><button class="btn wide ghost" data-x>${t('cancel')}</button>`,{onClose:stopCam});
    const v=$('video',s);v.srcObject=stream;v.play().catch(()=>{});$('[data-x]',s).onclick=()=>App.closeModal();
    (async function loop(){if(!stream)return;try{if(found(await read(v)))return;}catch(e){}setTimeout(loop,220);})();
  }
  async function photo(file){
    try{const read=await decoder();const img=new Image();img.src=URL.createObjectURL(file);await img.decode();
      const v=await read(img);URL.revokeObjectURL(img.src);if(!found(v))status(t('qrnotfound'),'err');}
    catch(e){status(e.message||t('noqr'),'err');}
  }
  sec.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='create')doCreate();if(b.id==='join')doJoin();if(b.id==='check')check();if(b.id==='scan')scan();});
  $('#photo',sec).onchange=e=>{const f=e.target.files[0];if(f)photo(f);e.target.value='';};
  App.cleanup=()=>{stopCam();if(S&&S.role==='host'&&!S.guest&&App.screen!=='game'){leave();}};
  if(arg.code)setTimeout(doJoin,200);
};
})(window);
</script>
<script>/* Ẩn huy hiệu "Powered by Netlify" do nền tảng tự chèn vào trang.
   Nhẹ: chỉ xét các phần tử con trực tiếp của <body>/<html> (nơi badge được chèn), gộp (debounce) lần quét, không đụng vào DOM của game. */
(function(){const RE=/powered by netlify/i;let tm=0;
const hit=e=>{if(e.id==='app'||e.id==='wfl'||e.id==='wbanner'||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
  const t=e.textContent||'';
  if(t.length<60&&RE.test(t)||(e.tagName==='A'&&/netlify\.com/i.test(e.href||'')))e.style.setProperty('display','none','important');
  if(e.shadowRoot&&RE.test(e.shadowRoot.textContent||''))e.style.setProperty('display','none','important');};
const run=()=>{tm=0;try{[document.body,document.documentElement].forEach(r=>r&&[...r.children].forEach(hit));}catch(e){}};
const sched=()=>{if(!tm)tm=setTimeout(run,400);};
new MutationObserver(sched).observe(document.body||document.documentElement,{childList:true});
run();setInterval(run,5000);})();</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
